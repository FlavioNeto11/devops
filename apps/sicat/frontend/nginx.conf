# SICAT frontend (SPA Vue) servido sob /sicat/ (SEM strip no Traefik).
# Usa PREFIXO + alias ESTATICO para os assets -> mime correto (ver TROUBLESHOOTING
# secao 14: alias com captura de regex serve application/octet-stream e quebra a SPA).
server {
  listen 80;
  server_name _;

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 'ok'; }

  location = /sicat { return 301 /sicat/; }

  # Assets versionados: prefixo + alias estatico (mime.types aplicado corretamente).
  location /sicat/assets/ {
    alias /usr/share/nginx/html/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # SPA: tudo sob /sicat/ cai no index.html (roteamento client-side, base /sicat/).
  #
  # no-store (e NAO no-cache) no documento. Medido em producao: em nvit.localhost
  # (nginx direto) o index.html vem com ETag e o no-cache revalida direito; ja em
  # dev.nvit.com.br (host real, atras do tunel) o ETag e REMOVIDO da resposta pelo
  # proxy — sobra so Last-Modified e a revalidacao fica fragil, entao o navegador
  # pode continuar servindo o documento ANTIGO depois do deploy (a sessao presa no
  # bundle velho ainda pede assets com hash que ja sumiram -> 404 e tela travada).
  # Com no-store o documento nunca e guardado e nao ha validador para o proxy tirar.
  # Os assets versionados por hash continuam com cache longo (immutable) no bloco
  # acima — o custo do no-store e so o HTML (poucos KB por navegacao dura).
  # A outra metade da defesa e no cliente: src/lib/stale-bundle-recovery.js
  # recarrega a SPA quando um chunk some no meio da sessao.
  location /sicat/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /sicat/index.html;
    add_header Cache-Control "no-store" always;
  }

  location = / { return 301 /sicat/; }
}
