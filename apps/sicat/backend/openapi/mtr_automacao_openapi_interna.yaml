    ReceiptResponsible:
      description: |-
        Responsável pelo RECEBIMENTO, para a baixa do MTR. Projeção enxuta do item da CETESB: os
        demais campos do envelope — incluindo `rrmAssinatura` — ficam de fora de propósito.
      type: object
      required:
      - rrmCodigo
      - name
      - cargo
      properties:
        rrmCodigo:
          type:
          - integer
          - string
          description: |-
            `rrmCodigo` da CETESB, repassado como veio (número ou string). É o valor que vai em
            `receiptPayload.rrmCodigo` de `POST /v1/manifestos/receive`. Item sem este campo é
            descartado da lista, então aqui ele nunca é nulo.
        name:
          type:
          - string
          - 'null'
          description: '`rrmNome` da CETESB.'
        cargo:
          type:
          - string
          - 'null'
          description: '`rrmCargo` da CETESB.'
    ReceiptResponsibleListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          description: Lista completa, sem paginação. Vazia quando a conta não tem responsável cadastrado.
          items:
            $ref: '#/components/schemas/ReceiptResponsible'
    CdfResponsible:
      description: |-
        Responsável pela EMISSÃO de CDF. Lista distinta da de recebimento — aqui o código é
        `cdrCodigo`. Assinatura nunca é exposta.
      type: object
      required:
      - cdrCodigo
      - name
      - cargo
      properties:
        cdrCodigo:
          type:
          - integer
          - string
          description: |-
            `cdrCodigo` da CETESB, repassado como veio (número ou string). É o valor que vai em
            `cdfPayload.responsavel.cdrCodigo` de `POST /v1/cdf/generate`. Item sem este campo é
            descartado da lista, então aqui ele nunca é nulo.
        name:
          type:
          - string
          - 'null'
          description: '`cdrNome` da CETESB.'
        cargo:
          type:
          - string
          - 'null'
          description: '`cdrCargo` da CETESB.'
    CdfResponsibleListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          description: Lista completa, sem paginação. Vazia quando a conta não tem responsável cadastrado.
          items:
            $ref: '#/components/schemas/CdfResponsible'
