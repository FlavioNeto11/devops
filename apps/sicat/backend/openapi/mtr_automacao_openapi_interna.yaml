    LoginRequest:
      type: object
      required:
      - document
      - password
      properties:
        document:
          type: string
          description: CNPJ (14 dígitos), CPF (11 dígitos) ou email de login
          example: '12345678000195'
        password:
          type: string
          format: password
          description: Senha do usuário cadastrada no portal CETESB
          example: senha-de-exemplo
          writeOnly: true
        recaptchaToken:
          type: string
          description: |-
            Token reCAPTCHA gerado pelo frontend. Campo opcional - CETESB aceita string vazia via API backend.
            Se omitido, será enviado como string vazia para CETESB.
          example: 03AGdBq24PBCd...XYZ
          nullable: true
    LoginResponse:
      type: object
      required:
      - token
      - expiresAt
      - user
      - partner
      properties:
        token:
          type: string
          description: JWT token para autenticação nas próximas requisições
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expiresAt:
          type: string
          format: date-time
          description: Data/hora de expiração do token (geralmente 24h)
          example: '2026-03-08T23:59:59Z'
        user:
          type: object
          required:
          - accessCode
          - name
          - email
          properties:
            accessCode:
              type: integer
              description: Código de acesso do usuário no sistema CETESB
              example: 999999
            name:
              type: string
              example: Fulano de Tal
            email:
              type: string
              format: email
              example: operador@exemplo.invalid
            cpf:
              type: string
              example: '12345678909'
              nullable: true
            document:
              type: string
              description: CNPJ ou CPF do login realizado
              example: '12345678000195'
            documentType:
              type: string
              enum:
              - F
              - J
              example: J
        partner:
          type: object
          required:
          - code
          - description
          - document
          - state
          properties:
            code:
              type: integer
              description: Código do parceiro no sistema CETESB
              example: 900001
            description:
              type: string
              description: Razão social ou nome do parceiro
              example: Empresa Exemplo LTDA
            tradeName:
              type: string
              nullable: true
              example: Empresa Exemplo LTDA
            document:
              type: string
              description: CNPJ do parceiro
              example: '12345678000195'
            state:
              type: object
              required:
              - code
              - abbreviation
              properties:
                code:
                  type: integer
                  example: 26
                abbreviation:
                  type: string
                  minLength: 2
                  maxLength: 2
                  example: SP
    PartnerInfo:
      type: object
      required:
      - partnerCode
      - description
      - document
      - documentType
      - state
      properties:
        partnerCode:
          type: integer
          description: Código do parceiro CETESB
          example: 900001
        description:
          type: string
          description: Razão social
          example: Empresa Exemplo LTDA
        tradeName:
          type: string
          nullable: true
          example: Empresa Exemplo LTDA
        document:
          type: string
          description: CNPJ ou CPF
          example: '12345678000195'
        documentType:
          type: string
