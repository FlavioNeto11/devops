  /v1/transporte/operacoes:
    post:
      operationId: transporteOperacoesCreate
      summary: Criar operação de transporte
      description: Cria o agregado `TransportOperation` em `draft`. Draft MÍNIMO exige apenas
        `route` (origem e destino — município + UF) e `cargoRegime` — partes/veículos/carga são
        opcionais neste PR (a completude, como contratante presente ou transportador com RNTRC
        ativo, é assunto dos gates de compliance de uma fase futura). Partes/veículos informados
        devem existir NA MESMA CONTA. Aceita `Idempotency-Key` opcional.
      tags:
      - Transporte - Operações
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransporteOperacaoCreateRequest'
      responses:
        '201':
          description: Operação criada em draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransporteOperacaoResource'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          description: Sessão SICAT ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
        '409':
          description: Já existe uma operação com este `referenceCode` nesta conta
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
    get:
      operationId: transporteOperacoesList
      summary: Listar operações de transporte
      description: Lista operações da conta informada, com filtro por status e paginação.
        Tenancy obrigatória — `integrationAccountId` é query param obrigatório. Itens vêm no
        formato RESUMO (sem `parties`/`vehicles`/`cargo`/`route`) — use o `GET` de detalhe para o
        agregado completo.
      tags:
      - Transporte - Operações
      responses:
        '200':
          description: Página de operações da conta (resumo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransporteOperacaoListResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          description: Sessão SICAT ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TransporteIntegrationAccountId'
      - in: query
        name: status
        description: Filtra pelo status atual da operação.
        schema:
          type: string
          enum:
          - draft
          - validating
          - blocked
          - ready_for_contract
          - contracted
          - ciot_pending
          - ciot_registered
          - fiscal_pending
          - ready_for_release
          - in_transit
          - completion_pending
          - completed
          - cancelled
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
  /v1/transporte/operacoes/{operationId}:
    get:
      operationId: transporteOperacaoGet
      summary: Consultar operação de transporte (agregado completo)
      description: Retorna o agregado completo — cabeçalho, `parties[]`, `vehicles[]`, `cargo[]`,
        `route` e `availableCommands[]` (comandos que a máquina de estados permite a partir do
        status atual, restritos às transições COM rota neste PR).
      tags:
      - Transporte - Operações
      responses:
        '200':
          description: Operação encontrada (agregado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransporteOperacaoResource'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          description: Sessão SICAT ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: operationId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/TransporteIntegrationAccountId'
    patch:
      operationId: transporteOperacaoUpdate
      summary: Atualizar dados da operação
      description: Atualização parcial dos DADOS do cabeçalho — NUNCA de `status` (campo
        `status` no corpo responde 422 `TRANSPORT_STATUS_IS_COMMAND_DRIVEN`; use os endpoints de
        transição). Permitido só com a operação em `draft`/`blocked` — caso contrário, 409.
        Locking otimista — `version` é obrigatório no corpo e deve casar com o `version` atual.
      tags:
      - Transporte - Operações
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransporteOperacaoUpdateRequest'
      responses:
        '200':
          description: Operação atualizada (agregado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransporteOperacaoResource'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Conflito de locking otimista (version defasada), `referenceCode`
            duplicado, ou operação fora de `draft`/`blocked` (`TRANSPORT_OPERATION_NOT_EDITABLE`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Corpo tentou alterar `status` diretamente (`TRANSPORT_STATUS_IS_COMMAND_DRIVEN`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Sessão SICAT ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: operationId
        in: path
        required: true
        schema: { type: string }
  /v1/transporte/operacoes/{operationId}/submeter-validacao:
    post:
      operationId: transporteOperacaoSubmeterValidacao
      summary: Submeter operação para validação (draft → validating → ready_for_contract|blocked)
      description: |-
        ORQUESTRA a transição de saída de `draft`. Compare-and-swap `draft --submit_validation-->
        validating` e, no mesmo request, avalia `GATE_PROPOSAL` (triggeredBy=transition): sem
        bloqueio ⇒ `validating --approve_validation--> ready_for_contract`; com bloqueio ⇒
        `validating --reject_validation--> blocked` (`blockedReasonCode` = motivo do primeiro
        check bloqueante). Transição composta deliberada — cada CAS é atômico por si; se a
        avaliação falhar de forma inesperada depois do primeiro CAS, a operação fica retida em
        `validating` (`reabrir`/`cancelar` resolvem). Comando fora do grafo a partir do status
        atual responde 409 `TRANSPORT_INVALID_TRANSITION`.
      tags:
      - Transporte - Operações
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransporteOperacaoTransicaoRequest'
            example:
              integrationAccountId: acc_exemplo_prod
              version: 2
      responses:
        '200':
          description: Operação em `ready_for_contract` (sem bloqueio) ou `blocked` (com
            bloqueio), com a avaliação de `GATE_PROPOSAL` que decidiu a transição
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransporteOperacaoComAvaliacaoResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Transição inválida a partir do status atual, ou version defasada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Sessão SICAT ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: operationId
        in: path
        required: true
        schema: { type: string }
  /v1/transporte/operacoes/{operationId}/contratar:
    post:
      operationId: transporteOperacaoContratar
      summary: Contratar operação (ready_for_contract → contracted)
      description: ATIVA a transição guardada por `GATE_CONTRACT`. `contractedAmount`, quando
        informado, atualiza `freight_contracted_amount` ANTES do gate (os evaluators de piso/VPO
        do gate enxergam o valor atualizado). Exige status `ready_for_contract` — comando fora do
        grafo responde 409 `TRANSPORT_INVALID_TRANSITION`. Bloqueio no gate ⇒ 409
        `TRANSPORT_GATE_BLOCKED` (a operação permanece em `ready_for_contract`; nenhuma transição
        é tentada nesse caso).
      tags:
      - Transporte - Operações
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransporteContratarRequest'
            example:
              integrationAccountId: acc_exemplo_prod
              version: 3
              contractedAmount: 3800.00
      responses:
        '200':
          description: Operação em `contracted`, com a avaliação de `GATE_CONTRACT` que aprovou a transição
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransporteOperacaoComAvaliacaoResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Transição inválida a partir do status atual, version defasada, ou gate
            bloqueado (`TRANSPORT_GATE_BLOCKED`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Sessão SICAT ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: operationId
        in: path
        required: true
        schema: { type: string }
  /v1/transporte/operacoes/{operationId}/reabrir:
    post:
      operationId: transporteOperacaoReabrir
      summary: Reabrir operação bloqueada (blocked → draft)
      description: Transição SEM gate — limpa `blockedReasonCode` e devolve a operação a `draft`
        para correção dos dados. Compare-and-swap por `version`; comando fora do grafo a partir
        do status atual responde 409 `TRANSPORT_INVALID_TRANSITION`.
      tags:
      - Transporte - Operações
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransporteOperacaoTransicaoRequest'
            example:
              integrationAccountId: acc_exemplo_prod
              version: 3
      responses:
        '200':
          description: Operação em `draft` (agregado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransporteOperacaoResource'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Transição inválida a partir do status atual, ou version defasada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Sessão SICAT ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: operationId
        in: path
        required: true
        schema: { type: string }
  /v1/transporte/operacoes/{operationId}/cancelar:
    post:
      operationId: transporteOperacaoCancelar
      summary: Cancelar operação de transporte
      description: Transição `cancel`, disponível de qualquer status não-terminal do grafo (a
        migration trava em DDL que `cancelled` sempre tem `cancelledReason`). `reason` é
        obrigatório (400 `TRANSPORT_CANCEL_REASON_REQUIRED` se ausente).
      tags:
      - Transporte - Operações
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransporteOperacaoCancelarRequest'
      responses:
        '200':
          description: Operação em `cancelled` (agregado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransporteOperacaoResource'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Transição inválida a partir do status atual (ex. já terminal), ou version
            defasada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Sessão SICAT ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: operationId
        in: path
        required: true
        schema: { type: string }
  /v1/transporte/operacoes/{operationId}/validar-conformidade:
    post:
      operationId: transporteOperacaoValidarConformidade
      summary: Avaliar conformidade de UM gate (ad-hoc, sem transição)
      description: Roda o motor de compliance (`TransportComplianceService`) para o `gate`
        informado, com `triggeredBy=user`, e persiste a avaliação (append-only) — SEM aplicar
        transição alguma na operação, independente do resultado. `referenceDate` default = hoje.
      tags:
      - Transporte - Conformidade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransporteValidarConformidadeRequest'
            example:
              integrationAccountId: acc_exemplo_prod
              gate: GATE_CIOT
              referenceDate: '2026-08-13'
      responses:
        '200':
          description: Avaliação do gate persistida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransporteConformidadeAvaliacaoResource'
              example:
                evaluationId: cmpeval_7a2b3c4d5e6f7a8b9c0d1e2f
                operationId: trop_1a2b3c4d5e6f7a8b9c0d1e2f3a4b
                gate: GATE_CIOT
                overallStatus: WARN
                referenceDate: '2026-08-13'
                evaluatedAt: '2026-08-13T12:30:00Z'
                checks:
                - ruleCode: TR-CIOT-001
                  ruleVersionLabel: v2026-05-universal
                  status: NOT_APPLICABLE
                  rawStatus: null
                  reasonCode: EVALUATOR_NOT_IMPLEMENTED
                  humanMessage: Avaliação automática de TR-CIOT-001 chega na Fase C do programa — sem evaluator ainda (não é erro).
                  legalBasis:
                  - reference: Res. ANTT 5.862/2019
                  - reference: Res. ANTT 6.078/2026
                  - reference: Lei 15.485/2026
                  - reference: Portaria SUROC 6/2026
                  evidenceRefs:
                  - cmpevd_1a2b3c4d5e6f7a8b9c0d1e2f3a4b
                - ruleCode: TR-CIOT-004
                  ruleVersionLabel: v2026-08-baseline
                  status: WARN
                  rawStatus: BLOCK
                  reasonCode: RULE_NOT_ENFORCEABLE
                  humanMessage: 'Dados mínimos para o CIOT incompletos: contractor, cargo.'
                  legalBasis:
                  - reference: Res. ANTT 5.862/2019
                  - reference: Res. ANTT 6.078/2026
                  - reference: Lei 15.485/2026
                  - reference: Portaria SUROC 6/2026
                  evidenceRefs:
                  - cmpevd_2b3c4d5e6f7a8b9c0d1e2f3a4b5c
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          description: Sessão SICAT ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: operationId
        in: path
        required: true
        schema: { type: string }
  /v1/transporte/operacoes/{operationId}/conformidade:
    get:
      operationId: transporteOperacaoConformidade
      summary: Overview de conformidade da operação (última avaliação por gate)
      description: Devolve, para cada um dos 8 gates do programa, a avaliação MAIS RECENTE já
        persistida para a operação (`null` quando o gate nunca foi avaliado) — não roda o motor;
        é leitura pura do histórico append-only.
      tags:
      - Transporte - Conformidade
      responses:
        '200':
          description: Overview de conformidade por gate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransporteConformidadeOverviewResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          description: Sessão SICAT ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: operationId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/TransporteIntegrationAccountId'
  /v1/transporte/operacoes/{operationId}/calcular-piso:
    post:
      operationId: transporteOperacaoCalcularPiso
      summary: Calcular e persistir o piso mínimo de frete (MODO SHADOW)
      description: |-
        Roda o `FreightFloorEngine` sobre a operação na `referenceDate` informada (default = hoje):
        resolve a Tabela A (só carga `lotacao` nesta fase — `fracionada`/`unknown` respondem
        `outcome=not_applicable`), deriva `cargoType` (primeira linha de `cargo[]`, mapeado para um
        dos 11 slugs canônicos), `axlesCount` (soma dos veículos vinculados) e `distanceKm` (da
        rota), resolve a versão de tabela VIGENTE e o par de coeficientes, calcula
        (`minimum = CCD*km + CC`, arredondamento HALF-UP a 2 casas) e PERSISTE o resultado
        (append-only, `freight_floor_calculations`) — SEMPRE grava uma linha, mesmo quando o
        `outcome` não é `calculated` (motivo em `reason`). Quando `outcome=calculated`, atualiza
        `freight.floorAmount` do cabeçalho (locking otimista por `version`, mesmo contrato do
        `PATCH`). MODO SHADOW: nada aqui torna TR-PMF-002/003 bloqueantes — rode
        `validar-conformidade`/`submeter-validacao` depois para ver o efeito nos gates.
      tags:
      - Transporte - Piso Mínimo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransportePisoCalcularRequest'
            example:
              integrationAccountId: acc_exemplo_prod
              version: 3
              referenceDate: '2026-08-13'
      responses:
        '200':
          description: Cálculo persistido (qualquer `outcome`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportePisoCalculoResource'
              example:
                id: ffcalc_7a2b3c4d5e6f7a8b9c0d1e2f
                operationId: trop_1a2b3c4d5e6f7a8b9c0d1e2f3a4b
                outcome: calculated
                reason: null
                referenceDate: '2026-08-13'
                cargoType: carga_geral
                cargoFloorSlug: carga_geral
                axlesCount: 6
                distanceKm: 850
                displacementCoefficient: 7.3547
                loadUnloadCoefficient: 671.93
                minimumAmount: 6923.43
                offeredAmount: 7200
                contractedAmount: null
                compliant: true
                floorVersionRef:
                  normativeReference: Resolução ANTT nº 6.084/2026
                  tableCode: A
                  reviewStatus: pending_review
                  effectiveFrom: '2026-07-17'
                engineVersion: freight-floor-engine/1.0.0
                trace:
                  formula: CCD*km + CC
                  components:
                    cargoType: carga_geral
                    axlesCount: 6
                    distanceKm: 850
                    displacementCoefficient: 7.3547
                    loadUnloadCoefficient: 671.93
                    displacementSubtotal: 6251.5
                    loadUnloadSubtotal: 671.93
                  cargoFloorSlug: carga_geral
                  floorVersion:
                    normativeReference: Resolução ANTT nº 6.084/2026
                    tableCode: A
                    reviewStatus: pending_review
                    effectiveFrom: '2026-07-17'
                createdAt: '2026-08-13T12:30:00Z'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          description: Sessão SICAT ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: operationId
        in: path
        required: true
        schema: { type: string }
  /v1/transporte/operacoes/{operationId}/calculos-piso:
    get:
      operationId: transporteOperacaoCalculosPisoList
      summary: Histórico paginado dos cálculos de piso da operação
      description: Leitura pura do histórico append-only de `freight_floor_calculations` da
        operação — mais recente primeiro. Recalcular a mesma operação (nova oferta, nova tabela
        revisada, `referenceDate` diferente) sempre cria uma linha NOVA, nunca sobrescreve.
      tags:
      - Transporte - Piso Mínimo
      responses:
        '200':
          description: Página de cálculos de piso da operação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportePisoCalculoListResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          description: Sessão SICAT ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: operationId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/TransporteIntegrationAccountId'
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
  /v1/transporte/piso/tabelas:
    get:
      operationId: transportePisoTabelasList
      summary: Tabelas de piso carregadas (admin read-only)
      description: Lista as versões de tabela de piso carregadas via `npm run load:freight-floor`
        (`freight_floor_versions`), com `reviewStatus`, contagem de coeficientes e
        `sourceUrl`/`sourceHash` — sem ids internos (identidade pública é
        `normativeReference` + `tableCode`). Consulta local síncrona, catálogo GLOBAL (sem
        tenancy — mesma natureza de `/v1/transporte/regras`).
      tags:
      - Transporte - Piso Mínimo
      responses:
        '200':
          description: Tabelas de piso carregadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportePisoTabelaListResponse'
              example:
                items:
                - normativeReference: Resolução ANTT nº 6.084/2026
                  resolution: 6.084/2026
                  tableCode: A
                  publishedAt: '2026-07-17'
                  effectiveFrom: '2026-07-17'
                  effectiveUntil: null
                  methodologyNotes: Atualização periódica das tabelas de piso mínimo da Res. ANTT
                    5.867/2020 (metodologia alterada pela Res. ANTT 6.076/2026).
                  sourceUrl: https://anttlegis.antt.gov.br/action/ActionDatalegis.php?acao=abrirTextoAto&tipo=RES&numeroAto=00006084&seqAto=000&valorAno=2026&orgao=DG/ANTT/MT&cod_modulo=623&cod_menu=9230
                  sourceHash: c046633f318d2c05dfe5a0c3982f44698199bc118e9e541d7f20c28565b74471
                  reviewStatus: pending_review
                  reviewedBy: null
                  reviewedAt: null
                  coefficientsCount: 150
        '401':
          description: Sessão SICAT ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Chave opcional para repetição segura de operações críticas.
      schema:
        type: string
        maxLength: 128
      example: 0f70f030-4438-4e21-84dd-c32aab5f5e43
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador de correlação fornecido pelo cliente; se ausente,
        a API gera um novo.
      schema:
        type: string
        maxLength: 128
      example: corr_6b7999cf8c7b4ea4b4c85a3a1f8d7f44
    TransporteIntegrationAccountId:
      name: integrationAccountId
      in: query
      required: true
      description: Conta CETESB dona do cadastro — tenancy obrigatória de toda leitura da
        vertical Transporte. Não existe conta "ativa da sessão" nesta API; o chamador informa
        explicitamente.
      schema:
        type: string
        maxLength: 128
      example: acc_exemplo_prod
  responses:
    AcceptedCommand:
      description: Comando aceito para execução assíncrona.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandAccepted'
          example:
            commandId: cmd_01JQW5M7Z6F6Y9N2P3Q4R5S6T7
            jobId: job_01JQW5M7Z6F6Y9N2P3Q4R5S6T7
            correlationId: corr_6b7999cf8c7b4ea4b4c85a3a1f8d7f44
            entityType: manifest
            entityId: man_01JQW5M6YY9M7K7B5N63GQ6E9S
            operation: manifest.submit
            status: queued
            submittedAt: '2026-03-07T20:18:44Z'
            links:
              job: /v1/jobs/job_01JQW5M7Z6F6Y9N2P3Q4R5S6T7
              entity: /v1/manifestos/man_01JQW5M6YY9M7K7B5N63GQ6E9S
              audit: /v1/audit/corr_6b7999cf8c7b4ea4b4c85a3a1f8d7f44
    Problem:
      description: Erro normalizado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.exemplo.local/problems/external-integration-failed
            title: Falha na integração externa
            status: 502
            code: EXTERNAL_INTEGRATION_FAILED
            detail: A CETESB respondeu com erro de negócio ao processar a operação
              solicitada.
            correlationId: corr_6b7999cf8c7b4ea4b4c85a3a1f8d7f44
            errors:
            - field: manifest.residues[0].quantity
              message: Valor incompatível com a unidade informada.
  schemas:
    CommandAccepted:
      type: object
      required:
      - commandId
      - jobId
      - correlationId
      - entityType
      - entityId
      - operation
      - status
      - submittedAt
      - links
      properties:
        commandId:
          type: string
        jobId:
          type: string
        correlationId:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        operation:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - retry_wait
          - succeeded
          - failed
          - dlq
          - cancelled
        submittedAt:
          type: string
          format: date-time
        links:
          type: object
          required:
          - job
          - entity
          - audit
          properties:
            job:
              type: string
            entity:
              type: string
            audit:
              type: string
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      - detail
      - correlationId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
    Pagination:
      type: object
      required:
      - page
      - pageSize
      - totalItems
      - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 500
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    OperationsOverviewResponse:
      type: object
      required: [generatedAt, jobs, manifests, accounts, sessions, recentDlq]
      properties:
        generatedAt: { type: string, format: date-time }
        jobs:
          type: object
          properties:
            queued: { type: integer }
            running: { type: integer }
            retry_wait: { type: integer }
            succeeded_24h: { type: integer }
            failed_24h: { type: integer }
            dlq_total: { type: integer }
        manifests:
          type: object
          properties:
            total: { type: integer }
            submitted: { type: integer }
            printed: { type: integer }
            cancelled: { type: integer }
            draft_or_failed: { type: integer }
        accounts:
          type: object
          properties:
            total: { type: integer }
            active: { type: integer }
        sessions:
          type: object
          properties:
            active: { type: integer }
            pending_auth: { type: integer }
            expired: { type: integer }
            invalid: { type: integer }
            revoked: { type: integer }
        recentDlq:
          type: array
          items:
            type: object
            properties:
              jobId: { type: string }
              operation: { type: string }
              entityType: { type: string }
              entityId: { type: string }
              dlqReason: { type: string, nullable: true }
              movedAt: { type: string, format: date-time, nullable: true }
              operationalStatus: { $ref: '#/components/schemas/JobOperationalStatus' }
              label: { type: string }
              severity: { $ref: '#/components/schemas/OperationalStatusSeverity' }
              recommendedAction: { type: string }
              retryable: { $ref: '#/components/schemas/OperationalStatusRetryable' }
              bucket: { $ref: '#/components/schemas/OperationalStatusBucket' }
        recentJobs:
          type: array
          description: Últimos jobs (qualquer status) ordenados por finished/started/queued.
          items: { $ref: '#/components/schemas/OverviewRecentJobItem' }
        recentErrors:
          type: array
          description: Últimos jobs em status failed/cancelled/dlq.
          items: { $ref: '#/components/schemas/OverviewRecentJobItem' }
    OverviewRecentJobItem:
      type: object
      required: [jobId, operation, status, operationalStatus, label, severity, recommendedAction, retryable, bucket]
      properties:
        jobId: { type: string }
        operation: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        status: { type: string }
        attempts: { type: integer }
        lastErrorCode: { type: string, nullable: true }
        lastErrorMessage: { type: string, nullable: true }
        dlqReason: { type: string, nullable: true }
        queuedAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        correlationId: { type: string, nullable: true }
        operationalStatus: { $ref: '#/components/schemas/JobOperationalStatus' }
        label: { type: string }
        severity: { $ref: '#/components/schemas/OperationalStatusSeverity' }
        recommendedAction: { type: string }
        retryable: { $ref: '#/components/schemas/OperationalStatusRetryable' }
        bucket: { $ref: '#/components/schemas/OperationalStatusBucket' }
        links:
          type: object
          properties:
            self: { type: string }
            events: { type: string }
            retry: { type: string }
            audit: { type: string, nullable: true }
    OperationalStatusSeverity:
      type: string
      description: Severidade visual associada ao operationalStatus (fase 04).
      enum: [info, success, warning, danger, neutral]
    OperationalStatusRetryable:
      type: string
      description: Indica se o operador pode reprocessar o job sem intervenção externa.
      enum: ['true', 'false', 'conditional']
    OperationalStatusBucket:
      type: string
      description: Agrupamento de ciclo de vida usado por dashboards.
      enum: [lifecycle, in_flight, blocked, terminal_success, terminal_failure]
    JobOperationalStatus:
      type: string
      description: Taxonomia ampliada (fase 04) derivada do status do job e do erro.
      enum:
      - ready
      - running
      - retry_wait
      - dlq
      - blocked_external_data
      - blocked_missing_context
      - awaiting_remote_confirmation
      - completed_with_no_items
      - completed_with_document
      - failed_validation
      - failed_remote_auth
      - failed_remote_contract
      - failed_internal_processing
    JobSearchItem:
      type: object
      properties:
        jobId: { type: string }
        commandId: { type: string, nullable: true }
        entityType: { type: string }
        entityId: { type: string }
        operation: { type: string }
        status: { type: string }
        operationalStatus: { $ref: '#/components/schemas/JobOperationalStatus' }
        label: { type: string }
        severity: { $ref: '#/components/schemas/OperationalStatusSeverity' }
        recommendedAction: { type: string }
        retryable: { $ref: '#/components/schemas/OperationalStatusRetryable' }
        bucket: { $ref: '#/components/schemas/OperationalStatusBucket' }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        queuedAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        nextRetryAt: { type: string, format: date-time, nullable: true }
        correlationId: { type: string, nullable: true }
        idempotencyKey: { type: string, nullable: true }
        lastErrorCode: { type: string, nullable: true }
        lastErrorMessage: { type: string, nullable: true }
        dlqReason: { type: string, nullable: true }
        dlqMovedAt: { type: string, format: date-time, nullable: true }
