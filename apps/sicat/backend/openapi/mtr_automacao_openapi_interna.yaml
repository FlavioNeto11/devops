  /v1/conversations/artifacts/{artifactId}/content:
    get:
      operationId: conversationDownloadArtifact
      summary: Baixar o conteúdo binário de um artefato conversacional
      description: |-
        Devolve o arquivo em si, com `Content-Disposition: attachment`. Mesmo escopo do endpoint de
        status: conta e sessão saem do principal, nunca da query.

        O download só é servido com o artefato em `available` ou `partial`; qualquer outro estado é
        `409`, e artefato vencido (TTL de 72 h) é `410`.
      tags:
      - Conversations
      responses:
        '200':
          description: Conteúdo do artefato
          headers:
            Content-Disposition:
              description: 'Sempre `attachment; filename="<fileName>"`.'
              schema: { type: string }
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          description: Sessão SICAT ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
        '403':
          description: Artefato fora do escopo (conta/sessão) do usuário autenticado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CodedProblem'
        '404':
          description: Artefato inexistente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CodedProblem'
        '409':
          description: Artefato ainda não disponível para download
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CodedProblem'
