    UnauthorizedProblem:
      description: |-
        Problem+JSON do 401 do `sicatAuthMiddleware`. Difere do schema `Problem` de propósito: o
        middleware chama `createProblem` SEM `code`, e `createProblem` só inclui o campo quando ele é
        truthy — declarar `code` como obrigatório aqui documentaria um campo que não vem. Vale para
        os 401 de TODAS as operações desta família.
      type: object
      required:
      - type
      - title
      - status
      - detail
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string
    CodedProblem:
      description: |-
        Problem+JSON com `code` estável, emitido por `errorHandlerMiddleware` a partir de um
        `AppError`. Difere do schema `Problem` em dois pontos REAIS: `errors` aqui é um OBJETO
        (`Problem.errors` é um array de `{field,message}`), e `correlationId`/`instance` só aparecem
        quando resolvidos.
      type: object
      required:
      - type
      - title
      - status
      - detail
      - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string
        errors:
          type: object
          description: Detalhes estruturados do erro. Objeto, não array.
          properties:
            retryAfterSeconds:
              type: integer
              minimum: 0
            attemptsRemaining:
              type: integer
              minimum: 0
            correlationId:
              type:
              - string
              - 'null'
          additionalProperties: true
    ConversationToolPolicy:
      type: object
      required:
      - toolName
      - riskLevel
      - allowChannels
      - requiresConfirmation
      - isAction
      - objective
      - dependencies
      - category
      properties:
        toolName:
          type: string
        riskLevel:
          type: string
          enum:
          - R1
          - R2
          - R3
          - R4
        allowChannels:
          type: array
          description: Canais em que a tool é alcançável. `whatsapp` só aparece nas tools habilitadas
            para o canal externo.
          items:
            type: string
            enum:
            - whatsapp
            - native_chat
            - inapp
        requiresConfirmation:
          type: boolean
        isAction:
          type: boolean
        objective:
          type:
          - string
          - 'null'
        dependencies:
          type: array
          items:
            type: string
        category:
          type:
          - string
          - 'null'
    ConversationToolsListResponse:
      type: object
      required:
      - items
      - count
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConversationToolPolicy'
        count:
          type: integer
          minimum: 0
    ConversationArtifactStatus:
      type: object
      required:
      - artifactId
      - title
      - artifactType
      - status
      - progress
      - links
      properties:
        artifactId:
          type: string
        title:
          type: string
        artifactType:
          type: string
          enum:
          - document
          - zip
        sourceKind:
          type:
          - string
          - 'null'
        status:
          description: |-
            Estados que o código realmente grava. `processing` é o inicial; `partial` só existe em
            artefato de lote (ZIP) com itens que falharam; `expired` é carimbado na leitura, quando o
            TTL de 72 h já passou. `available` e `partial` são os únicos que servem download.
          type: string
          enum:
          - processing
          - available
          - partial
          - failed
          - expired
        fileName:
          type:
          - string
          - 'null'
        mimeType:
          type:
          - string
          - 'null'
        correlationId:
          type:
          - string
          - 'null'
        jobId:
          type:
          - string
          - 'null'
        integrationAccountId:
          type:
          - string
          - 'null'
        sessionContextId:
          type:
          - string
          - 'null'
        conversationSessionId:
          type:
          - string
          - 'null'
        conversationTurnId:
          type:
          - string
          - 'null'
        progress:
          type: object
          required:
          - total
          - completed
          - failed
          - pending
          properties:
            total:
              type: integer
              minimum: 0
            completed:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
            pending:
              type: integer
              minimum: 0
        availableAt:
          type:
          - string
          - 'null'
          format: date-time
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sourceRefs:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
        links:
          type: object
          required:
          - statusUrl
          - downloadUrl
          properties:
            statusUrl:
              type: string
            downloadUrl:
              type: string
    ConversationFeedbackRequest:
      type: object
      required:
      - feedbackType
      - correlationId
      properties:
        feedbackType:
          type: string
          enum:
          - positive
          - negative
        correlationId:
          type: string
          description: Correlação do turno avaliado. Obrigatório e não pode ser string vazia.
        conversationSessionId:
          type:
          - string
          - 'null'
        channel:
          type: string
          description: Canal declarado. Só para validação; o canal gravado sai do principal.
          enum:
          - native_chat
          - inapp
        toolName:
          type:
          - string
          - 'null'
        userComment:
          type: string
          description: Truncado em 500 caracteres pelo servidor.
    ConversationFeedbackResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - id
          - correlationId
          - feedbackType
          properties:
            id:
              type: string
            correlationId:
              type: string
            feedbackType:
              type: string
              enum:
              - positive
              - negative
    ConversationFeedbackInvalidError:
      description: |-
        Envelope de erro ESCRITO À MÃO no handler de feedback (`conversation-routes.ts`). Não é
        problem+json: não tem `type`, `status`, `instance` nem `correlationId`, e o Content-Type é
        `application/json`. Documentado como é, não como deveria ser.
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - FEEDBACK_INVALID
            message:
              type: string
    ConversationTurnRequest:
      type: object
      required:
      - message
      properties:
        channel:
          type: string
          description: |-
            Ausente equivale a `inapp`. `whatsapp` é recusado com 403 — só o adaptador de canal do
            servidor produz esse valor.
          enum:
          - native_chat
          - inapp
        conversationSessionId:
          type: string
          description: Retoma uma sessão existente. A chave de sessão em si é derivada do principal.
        message:
          type: string
        context:
          type: object
          description: Contexto de tela (rota, manifesto em foco, dicas de campo). Não decide identidade.
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        options:
          type: object
          properties:
            allowActions:
              type: boolean
              default: true
          additionalProperties: true
        toolRequest:
          type: object
          description: Acionamento explícito de tool pelo cliente (quick-actions do copiloto).
          required:
          - name
          properties:
            name:
              type: string
            arguments:
              type: object
              additionalProperties: true
            confirmed:
              type: boolean
              default: false
    ConversationTurnMultipartRequest:
      description: |-
        Mesma superfície do turno textual, com anexos. `files` aceita no máximo 20 arquivos de
        10 MiB cada; os demais campos chegam como campos de TEXTO do formulário (objetos vão
        serializados em JSON).
      type: object
      required:
      - message
      properties:
        files:
          type: array
          maxItems: 20
          items:
            type: string
            format: binary
        channel:
          type: string
          enum:
          - native_chat
          - inapp
        conversationSessionId:
          type: string
        message:
          type: string
        context:
          type: string
        metadata:
          type: string
        options:
          type: string
        toolRequest:
          type: string
    ConversationTurnResponse:
      type: object
      required:
      - conversationSessionId
      - conversationTurnId
      - correlationId
      - channel
      - status
      - responseText
      - llm
      - toolCall
      - policy
      - context
      properties:
        conversationSessionId:
          type: string
        conversationTurnId:
          type: string
        correlationId:
          type: string
        channel:
          type: string
          enum:
          - whatsapp
          - native_chat
          - inapp
        status:
          type: string
          enum:
          - responded
          - blocked
          - executed
          - failed
        responseText:
          type: string
        llm:
          type: object
          required:
          - provider
          - confidence
          - agentModelUsed
          - synthesisModelUsed
          properties:
            provider:
              type: string
            confidence:
              type: number
            agentModelUsed:
              type: string
            synthesisModelUsed:
              type: string
            escalationModelUsed:
              type: string
            escalationReason:
              type: string
        toolCall:
          type:
          - object
          - 'null'
          required:
          - name
          - arguments
          properties:
            name:
              type: string
            arguments:
              type: object
              additionalProperties: true
        policy:
          type: object
          required:
          - allowed
          - reasonCode
          - reason
          - requiresConfirmation
          - riskLevel
          properties:
            allowed:
              type: boolean
            reasonCode:
              type:
              - string
              - 'null'
            reason:
              type:
              - string
              - 'null'
            requiresConfirmation:
              type: boolean
            riskLevel:
              type:
              - string
              - 'null'
            permissionShortfall:
              type:
              - object
              - 'null'
              required:
              - required
              - catalogSatisfiable
              properties:
                required:
                  type: string
                catalogSatisfiable:
                  type: boolean
        context:
          type: object
          required:
          - integrationAccountId
          - sessionContextId
          - manifestId
          - jobId
          properties:
            integrationAccountId:
              type:
              - string
              - 'null'
            sessionContextId:
              type:
              - string
              - 'null'
            manifestId:
              type:
              - string
              - 'null'
            jobId:
              type:
              - string
              - 'null'
        result: {}
        jobId:
          type:
          - string
          - 'null'
    ChannelLink:
      type: object
      required:
      - id
      - channelType
      - phone
      - phoneMasked
      - verificationStatus
      - verifiedAt
      - createdAt
      properties:
        id:
          type: string
        channelType:
          type: string
          enum:
          - whatsapp
        phone:
          type: string
          description: Telefone canônico (só dígitos, com DDI). É o número do próprio autenticado.
        phoneMasked:
          type: string
        verificationStatus:
          type: string
          enum:
          - pending
          - verified
        verifiedAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
    ChannelLinkChallenge:
      description: |-
        Desafio de OTP. NUNCA carrega o código, o hash, o nome do provedor, o id da mensagem nem o
        erro de entrega — e o telefone sai apenas mascarado.
      type: object
      required:
      - challengeId
      - channelType
      - phoneMasked
      - expiresAt
      - attemptsRemaining
      - sendsRemaining
      - canResendAt
      - deliveryStatus
      properties:
        challengeId:
          type: string
        channelType:
          type: string
          enum:
          - whatsapp
        phoneMasked:
          type: string
        expiresAt:
          type: string
          format: date-time
        attemptsRemaining:
          type: integer
          minimum: 0
        sendsRemaining:
          type: integer
          minimum: 0
        canResendAt:
          type:
          - string
          - 'null'
          format: date-time
        deliveryStatus:
          type: string
          description: '`sent` significa "o provedor ACEITOU", nunca "chegou no aparelho".'
          enum:
          - pending
          - sent
          - failed
        correlationId:
          type:
          - string
          - 'null'
    ChannelLinkLimits:
      type: object
      required:
      - maxLinksPerUser
      - otpTtlSeconds
      - maxAttempts
      - maxSends
      - resendCooldownSeconds
      properties:
        maxLinksPerUser:
          type: integer
        otpTtlSeconds:
          type: integer
        maxAttempts:
          type: integer
        maxSends:
          type: integer
        resendCooldownSeconds:
          type: integer
    ChannelLinksListResponse:
      type: object
      required:
      - links
      - pendingChallenge
      - limits
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/ChannelLink'
        pendingChallenge:
          oneOf:
          - $ref: '#/components/schemas/ChannelLinkChallenge'
          - type: 'null'
        limits:
          $ref: '#/components/schemas/ChannelLinkLimits'
    ChannelLinkStartRequest:
      type: object
      required:
      - phone
      properties:
        channelType:
          type: string
          description: Ausente equivale a `whatsapp`.
          enum:
          - whatsapp
        phone:
          type: string
          description: |-
            DDI+DDD+número. É canonicalizado no servidor (o DDI default vem de
            `CHANNEL_LINK_DEFAULT_COUNTRY_CODE`) e precisa ficar entre 12 e 15 dígitos depois disso.
          example: '5511999990032'
    ChannelLinkConfirmRequest:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          description: Exatamente 6 dígitos. Fora desse formato, `CHANNEL_LINK_CODE_MALFORMED`.
          pattern: ^[0-9]{6}$
    ChannelLinkConfirmResponse:
      type: object
      required:
      - link
      - transferred
      properties:
        link:
          $ref: '#/components/schemas/ChannelLink'
        transferred:
          type: boolean
          description: |-
            `true` quando o número estava vinculado a OUTRA conta e a posse comprovada o transferiu.
            O dono anterior nunca é identificado.
    WhatsAppActionWindow:
      type: object
      required:
      - id
      - maskedUserKey
      - integrationAccountId
      - expiresAt
      - actionsUsed
      - actionsBudget
      - openedAt
      properties:
        id:
          type: string
        maskedUserKey:
          type: string
          description: Telefone mascarado. O E.164 cru nunca sai neste DTO.
        integrationAccountId:
          type:
          - string
          - 'null'
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        actionsUsed:
          type: integer
          minimum: 0
        actionsBudget:
          type: integer
          minimum: 0
        openedAt:
          type:
          - string
          - 'null'
          format: date-time
    WhatsAppActionWindowOpenRequest:
      type: object
      properties:
        hours:
          type: integer
          minimum: 1
          description: |-
            Duração PEDIDA. O servidor aplica default e teto de configuração
            (`WHATSAPP_ACTION_WINDOW_DEFAULT_HOURS` / `_MAX_HOURS`), então a resposta pode divergir.
        actionsBudget:
          type: integer
          minimum: 1
          description: |-
            Orçamento de ações PEDIDO, sujeito a default e teto
            (`WHATSAPP_ACTION_WINDOW_DEFAULT_BUDGET` / `_MAX_BUDGET`).
        budget:
          type: integer
          minimum: 1
          description: Alias legado de `actionsBudget`; usado apenas quando `actionsBudget` está ausente.
    WhatsAppActionWindowResponse:
      type: object
      required:
      - window
      properties:
        window:
          oneOf:
          - $ref: '#/components/schemas/WhatsAppActionWindow'
          - type: 'null'
    TransporteRegraVersaoResource:
      type: object
      description: Versão de uma regra TR-* numa janela de vigência. Ids internos do catálogo
        (`regrule_`/`regrulev_`) e `source_hash` NUNCA saem neste DTO — a identidade pública é
        `code` + `versionLabel`.
      required:
      - versionLabel
      - legalBasis
      - summary
      - effectiveFrom
      - effectiveUntil
      - implementationState
      - blocking
      - severity
      - reviewedBy
      - reviewedAt
      properties:
        versionLabel:
          type: string
        legalBasis:
          type: array
          items:
            type: object
            required:
            - reference
            properties:
              reference:
                type: string
              article:
                type:
                - string
                - 'null'
        summary:
          type: string
        effectiveFrom:
          type: string
          format: date
        effectiveUntil:
          type:
          - string
          - 'null'
          format: date
        implementationState:
          type: string
          enum:
          - DRAFT
          - UNDER_REVIEW
          - ACTIVE
