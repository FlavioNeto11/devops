          default: BRL
        paymentMethod:
          type: string
        paymentTermDays:
          type: integer
          description: Deve ser >= 0 quando informado.
        route:
          $ref: '#/components/schemas/TransporteOperacaoRotaCreateRequest'
        parties:
          type: array
          items:
            $ref: '#/components/schemas/TransporteOperacaoParteCreateRequest'
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/TransporteOperacaoVeiculoVinculoCreateRequest'
        cargo:
          type: array
          items:
            $ref: '#/components/schemas/TransporteOperacaoCargaCreateRequest'
    TransporteOperacaoUpdateRequest:
      type: object
      description: Atualização parcial dos DADOS do cabeçalho — NUNCA `status` (rejeitado com
        422 `TRANSPORT_STATUS_IS_COMMAND_DRIVEN`). Permitida só com a operação em `draft`/`blocked`.
      required:
      - integrationAccountId
      - version
      properties:
        integrationAccountId:
          type: string
        version:
          type: integer
          minimum: 1
          description: Deve casar com o `version` atual do registro; caso contrário, 409.
        referenceCode:
          type: string
        cargoRegime:
          type: string
          enum:
          - lotacao
          - fracionada
          - unknown
        operationClassification:
          type: string
        freightOfferedAmount:
          type: number
        freightContractedAmount:
          type: number
        freightFloorAmount:
          type: number
        tollAmount:
          type: number
        vpoAmount:
          type: number
        otherComponentsAmount:
          type: number
        totalContractValue:
          type: number
        currency:
          type: string
        paymentMethod:
          type: string
        paymentTermDays:
          type: integer
    TransporteOperacaoTransicaoRequest:
      type: object
      description: Corpo comum das transições sem gate (`submeter-validacao`).
      required:
      - integrationAccountId
      - version
      properties:
        integrationAccountId:
          type: string
        version:
          type: integer
          minimum: 1
          description: Deve casar com o `version` atual do registro; caso contrário, 409.
    TransporteOperacaoCancelarRequest:
      type: object
      required:
      - integrationAccountId
      - version
      - reason
      properties:
        integrationAccountId:
          type: string
        version:
          type: integer
          minimum: 1
          description: Deve casar com o `version` atual do registro; caso contrário, 409.
        reason:
          type: string
          description: Obrigatório — motivo do cancelamento (vira `cancelledReason` no banco).
    TransporteContratarRequest:
      type: object
      required:
      - integrationAccountId
      - version
      properties:
        integrationAccountId:
          type: string
        version:
          type: integer
          minimum: 1
          description: Deve casar com o `version` atual do registro; caso contrário, 409.
        contractedAmount:
          type: number
          description: Quando informado, atualiza `freight.contractedAmount` ANTES da avaliação
            de `GATE_CONTRACT` — deve ser >= 0.
    TransporteConformidadeCheckResource:
      type: object
      description: Resultado de UMA regra TR-* dentro de uma avaliação de gate.
      required:
      - ruleCode
      - ruleVersionLabel
      - status
      - rawStatus
      - reasonCode
      - humanMessage
      - legalBasis
      - evidenceRefs
      properties:
        ruleCode:
          type: string
          description: 'Código estável da regra do catálogo (ex.: TR-PMF-002).'
        ruleVersionLabel:
          type: string
          description: Vazio quando a regra não tinha versão vigente na data de referência.
        status:
          type: string
          description: Status PÓS-CLAMP de enforcement (o que de fato vale para a decisão da transição).
          enum:
          - PASS
          - WARN
          - BLOCK
          - NOT_APPLICABLE
        rawStatus:
          type:
          - string
          - 'null'
          description: Status ANTES do clamp — só preenchido quando o clamp de enforcement mudou
            o status (regra não-ACTIVE ou não-`blocking` que teria dado `BLOCK`); `null` quando
            não houve clamp.
          enum:
          - PASS
          - WARN
          - BLOCK
          - NOT_APPLICABLE
          - null
        reasonCode:
          type:
          - string
          - 'null'
          description: 'Ex.: FLOOR_NOT_CALCULATED, RULE_NOT_ENFORCEABLE, EVALUATOR_NOT_IMPLEMENTED.'
        humanMessage:
          type: string
        legalBasis:
          type: array
          items:
            type: object
            required:
            - reference
            properties:
              reference:
                type: string
              article:
                type:
                - string
                - 'null'
        evidenceRefs:
          type: array
          description: Ids de `compliance_evidence` que sustentam este check.
          items:
            type: string
    TransporteConformidadeAvaliacaoResource:
      type: object
      description: UMA avaliação de UM gate sobre UMA operação — persistida append-only
        (`compliance_evaluations`); reavaliar o mesmo gate cria uma linha NOVA, nunca sobrescreve.
      required:
      - evaluationId
      - operationId
      - gate
      - overallStatus
      - referenceDate
      - evaluatedAt
      - checks
      properties:
        evaluationId:
          type: string
        operationId:
          type: string
        gate:
          type: string
          enum:
          - GATE_PROPOSAL
          - GATE_CONTRACT
          - GATE_CIOT
          - GATE_FISCAL
          - GATE_PRE_BOARDING
          - GATE_RELEASE
          - GATE_IN_TRANSIT
          - GATE_COMPLETION
        overallStatus:
          type: string
          description: Pior status dos checks pós-clamp (`BLOCK` > `WARN` > `PASS`;
            `NOT_APPLICABLE` não conta).
          enum:
          - PASS
          - WARN
          - BLOCK
        referenceDate:
          type: string
          format: date
        evaluatedAt:
          type: string
          format: date-time
        checks:
          type: array
          items:
            $ref: '#/components/schemas/TransporteConformidadeCheckResource'
    TransporteConformidadeOverviewResponse:
      type: object
      required:
      - operationId
      - gates
      properties:
        operationId:
          type: string
        gates:
          type: array
          items:
            type: object
            required:
            - gate
            - latestEvaluation
            properties:
              gate:
                type: string
                enum:
                - GATE_PROPOSAL
                - GATE_CONTRACT
                - GATE_CIOT
                - GATE_FISCAL
                - GATE_PRE_BOARDING
                - GATE_RELEASE
                - GATE_IN_TRANSIT
                - GATE_COMPLETION
              latestEvaluation:
                oneOf:
                - $ref: '#/components/schemas/TransporteConformidadeAvaliacaoResource'
                - type: 'null'
    TransporteValidarConformidadeRequest:
      type: object
      required:
      - integrationAccountId
      - gate
      properties:
        integrationAccountId:
          type: string
        gate:
          type: string
          enum:
          - GATE_PROPOSAL
          - GATE_CONTRACT
          - GATE_CIOT
          - GATE_FISCAL
          - GATE_PRE_BOARDING
          - GATE_RELEASE
          - GATE_IN_TRANSIT
          - GATE_COMPLETION
        referenceDate:
          type: string
          format: date
          description: Default = hoje.
    TransporteOperacaoComAvaliacaoResponse:
      type: object
      description: Resposta das transições ATIVADAS por gate (`submeter-validacao`/`contratar`) —
        a operação já refletindo a transição aplicada (ou não, em bloqueio de `contratar`) + a
        avaliação que decidiu.
      required:
      - operation
      - evaluation
      properties:
        operation:
          $ref: '#/components/schemas/TransporteOperacaoResource'
        evaluation:
          $ref: '#/components/schemas/TransporteConformidadeAvaliacaoResource'
    TransportePisoCalcularRequest:
      type: object
      required:
      - integrationAccountId
      - version
      properties:
        integrationAccountId:
          type: string
        version:
          type: integer
          minimum: 1
          description: Version atual do cabeçalho da operação (locking otimista) — usada no CAS
            do update de `freight.floorAmount` quando `outcome=calculated`.
        referenceDate:
          type: string
          format: date
          description: Default = hoje.
    TransportePisoTabelaVersaoRefResource:
      type: object
      description: Referência (SEM id interno) da versão de tabela usada num cálculo.
      required:
      - normativeReference
      - tableCode
      - reviewStatus
      - effectiveFrom
      properties:
        normativeReference:
          type: string
        tableCode:
          type: string
          enum: [A, B, C, D]
        reviewStatus:
          type: string
          enum: [pending_review, reviewed, rejected]
        effectiveFrom:
          type: string
          format: date
    TransportePisoCalculoResource:
      type: object
      description: UM cálculo do `FreightFloorEngine` sobre UMA operação — persistido append-only
        (`freight_floor_calculations`); recalcular a mesma operação cria uma linha NOVA, nunca
        sobrescreve. MODO SHADOW — nenhum campo aqui torna TR-PMF-002/003 bloqueantes por si só.
      required:
      - id
      - operationId
      - outcome
      - reason
      - referenceDate
      - cargoType
      - cargoFloorSlug
      - axlesCount
      - distanceKm
      - displacementCoefficient
      - loadUnloadCoefficient
      - minimumAmount
      - offeredAmount
      - contractedAmount
      - compliant
      - floorVersionRef
      - engineVersion
      - trace
      - createdAt
      properties:
        id:
          type: string
        operationId:
          type: string
        outcome:
          type: string
          description: '`calculated`: piso resolvido. `not_applicable`: regime não exige piso
            (fracionada/unknown). `missing_inputs`: cargoType/axlesCount/distanceKm insuficientes.
            `missing_coefficients`: nenhuma tabela vigente, ou tabela vigente sem o par
            cargoType/axlesCount. O motivo textual vai em `reason`.'
          enum: [calculated, not_applicable, missing_coefficients, missing_inputs]
        reason:
          type:
          - string
          - 'null'
          description: Preenchido quando `outcome != calculated` — explica o que faltou.
        referenceDate:
          type: string
          format: date
        cargoType:
          type:
          - string
          - 'null'
          description: Valor bruto de `cargo[0].cargoType` da operação (texto livre do operador).
        cargoFloorSlug:
          type:
          - string
          - 'null'
          description: Um dos 11 slugs canônicos da Tabela A, ou `null` quando `cargoType` não mapeou.
        axlesCount:
          type:
          - integer
          - 'null'
          description: Soma dos `axlesCount` dos veículos vinculados à operação.
        distanceKm:
          type:
          - number
          - 'null'
        displacementCoefficient:
          type:
          - number
          - 'null'
          description: CCD (R$/km) da tabela vigente, quando resolvido.
        loadUnloadCoefficient:
          type:
          - number
          - 'null'
          description: CC (R$) da tabela vigente, quando resolvido.
        minimumAmount:
          type:
          - number
          - 'null'
          description: '`displacementCoefficient * distanceKm + loadUnloadCoefficient`,
            arredondado a 2 casas HALF-UP.'
        offeredAmount:
          type:
          - number
          - 'null'
        contractedAmount:
          type:
          - number
          - 'null'
        compliant:
          type:
          - boolean
          - 'null'
          description: '`offeredAmount` (ou `contractedAmount`, se `offeredAmount` ausente) >=
            `minimumAmount`; `null` quando `minimumAmount` ou os dois valores comparados são nulos.'
        floorVersionRef:
          oneOf:
          - $ref: '#/components/schemas/TransportePisoTabelaVersaoRefResource'
          - type: 'null'
        engineVersion:
          type: string
        trace:
          type: object
          description: Traço completo do cálculo (fórmula, componentes, versão de tabela usada) —
            free-form, reproduzível a partir dos insumos.
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    TransportePisoCalculoListResponse:
      type: object
      required:
      - items
      - total
      - page
      - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransportePisoCalculoResource'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
    TransportePisoTabelaResource:
      type: object
      description: Versão de tabela de piso carregada (`freight_floor_versions`) — SEM id interno;
        identidade pública é `normativeReference` + `tableCode`.
      required:
      - normativeReference
      - resolution
      - tableCode
      - publishedAt
      - effectiveFrom
      - effectiveUntil
      - methodologyNotes
      - sourceUrl
      - sourceHash
      - reviewStatus
      - reviewedBy
      - reviewedAt
      - coefficientsCount
      properties:
        normativeReference:
          type: string
        resolution:
          type:
          - string
          - 'null'
        tableCode:
          type: string
          enum: [A, B, C, D]
        publishedAt:
          type:
          - string
          - 'null'
          format: date
        effectiveFrom:
          type: string
          format: date
        effectiveUntil:
          type:
          - string
          - 'null'
          format: date
        methodologyNotes:
          type: string
        sourceUrl:
          type:
          - string
          - 'null'
        sourceHash:
          type:
          - string
          - 'null'
          description: SHA-256 do arquivo `.json` de referência carregado.
        reviewStatus:
          type: string
          description: Sempre `pending_review` neste PR — promoção a `reviewed` é ato humano
            futuro (rota admin ainda não existe nesta fase).
          enum: [pending_review, reviewed, rejected]
        reviewedBy:
          type:
          - string
          - 'null'
        reviewedAt:
          type:
          - string
          - 'null'
          format: date-time
        coefficientsCount:
          type: integer
          minimum: 0
    TransportePisoTabelaListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransportePisoTabelaResource'
