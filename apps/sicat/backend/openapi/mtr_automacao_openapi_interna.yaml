  /v1/health/jobs/active/{jobId}/cancel:
    post:
      summary: Cancelar job da fila ativa
      description: |-
        Cancela um job que ainda NÃO começou a rodar. O cancelamento é gravado como TÉRMINO: a linha
        vai para `status = 'failed'`, com `last_error_code = 'JOB_CANCELLED_MANUAL'` e o motivo em
        `last_error_message`. Por isso o `status` devolvido é `failed`, e não `cancelled` — o enum de
        `JobResource` tem `cancelled`, mas esta rota não o usa.

        Só `queued` e `retry_wait` são canceláveis. `running` responde 409
        (`JOB_RUNNING_CANNOT_CANCEL`): quem solta a linha é o worker. Qualquer outro status responde
        409 `JOB_NOT_ACTIVE`.
      tags:
      - Health
      responses:
        '200':
          description: Job cancelado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthJobCancelResponse'
              example:
                jobId: job_01JQW5M0D2G3CTQYV4N9AB8F1R
                status: failed
                message: Job cancelled successfully.
        '401':
          description: Sessão SICAT ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: |-
            Job em execução (`JOB_RUNNING_CANNOT_CANCEL`) ou fora da fila ativa (`JOB_NOT_ACTIVE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CodedProblem'
        '500':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthJobCancelRequest'
            example:
              reason: cancelado pelo operador na janela de manutenção
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: jobId
        in: path
        required: true
        schema:
          type: string
  /v1/health/jobs/active/{jobId}:
    delete:
      summary: Remover job da fila ativa
      description: |-
        PURGA, não cancelamento: apaga a linha de `jobs` (`delete from jobs`) e não deixa histórico.
        Para encerrar um job preservando a trilha, use
        `POST /v1/health/jobs/active/{jobId}/cancel`.

        Aceita `queued`, `retry_wait`, `failed` e `succeeded`. `running` responde 409
        (`JOB_RUNNING_CANNOT_REMOVE`); qualquer outro status — `dlq`, inclusive — responde 409
        `JOB_STATUS_CANNOT_REMOVE`, porque job em DLQ sai por `DELETE /v1/health/jobs/dlq/{jobId}`.
      tags:
      - Health
      responses:
        '204':
          description: Job removido (sem corpo)
        '401':
          description: Sessão SICAT ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: |-
            Job em execução (`JOB_RUNNING_CANNOT_REMOVE`) ou em status que não permite remoção
            (`JOB_STATUS_CANNOT_REMOVE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CodedProblem'
        '500':
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: jobId
        in: path
        required: true
        schema:
          type: string
