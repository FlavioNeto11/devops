  /v1/manifestos/receipt-responsibles:
    get:
      summary: Listar responsáveis pelo recebimento
      description: |-
        Lista SÍNCRONA (não passa pela fila) dos responsáveis pelo recebimento cadastrados na CETESB
        para o parceiro da conta — é a lista que o destinador escolhe na baixa do MTR e que alimenta
        `receiptPayload.rrmCodigo` de `POST /v1/manifestos/receive`.

        Fonte: gateway → `GET /api/mtr/manifesto/listaResponsavelRecebimento/{parCodigo}`. O DTO
        expõe SÓ `rrmCodigo`, `name` e `cargo`; a assinatura (`rrmAssinatura`) nunca sai daqui.

        Item sem `rrmCodigo` é descartado da lista. Se o gateway em uso não implementar a operação, a
        resposta é `{"items": []}` — 200 com lista vazia, nunca erro.

        No Express esta rota é registrada ANTES de `/v1/manifestos/{id}`, de propósito: invertida, o
        `:id` capturaria `receipt-responsibles`.
      tags:
      - Manifestos
      responses:
        '200':
          description: Lista de responsáveis pelo recebimento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptResponsibleListResponse'
              example:
                items:
                - rrmCodigo: 12345
                  name: Responsável Exemplo
                  cargo: Encarregado de recebimento
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          description: Sessão SICAT ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
        '502':
          description: |-
            Falha ao consultar a CETESB (`CETESB_REMOTE_ERROR`, `CETESB_HTTP_ERROR`,
            `CETESB_AUTH_FAILED`, `CETESB_NON_JSON_RESPONSE`, `CETESB_NETWORK_ERROR` ou
            `CETESB_RETRY_EXHAUSTED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CodedProblem'
        '500':
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: integrationAccountId
        in: query
        required: true
        description: Conta de integração. Ausente ou vazio responde 400.
        schema:
          type: string
      - name: sessionContextId
        in: query
        required: false
        description: |-
          Contexto de sessão operacional. Presente, é validado (tem de existir e pertencer à conta —
          senão 400); ausente, a conta é apenas garantida e o gateway resolve a sessão.
        schema:
          type: string
