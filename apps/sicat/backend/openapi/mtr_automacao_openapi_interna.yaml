  /v1/cdf/responsibles:
    get:
      summary: Listar responsáveis pela emissão de CDF
      description: |-
        Lista SÍNCRONA (não passa pela fila) dos responsáveis pela emissão de CDF cadastrados na
        CETESB para o parceiro da conta — alimenta `cdfPayload.responsavel.cdrCodigo` de
        `POST /v1/cdf/generate`, e o worker de `cdf.generate` revalida o código contra a lista remota.

        É uma lista DIFERENTE da de `GET /v1/manifestos/receipt-responsibles`: lá o código é
        `rrmCodigo` (responsável pelo RECEBIMENTO), aqui é `cdrCodigo`. Trocar um pelo outro é o
        erro fácil.

        Fonte: gateway → `GET /api/mtr/responsavel/{parCodigo}`. O DTO expõe SÓ `cdrCodigo`, `name` e
        `cargo`; assinatura nunca sai daqui. Item sem `cdrCodigo` é descartado. Se o gateway em uso
        não implementar a operação, a resposta é `{"items": []}` — 200 com lista vazia, nunca erro.
      tags:
      - CDF
      responses:
        '200':
          description: Lista de responsáveis pela emissão de CDF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CdfResponsibleListResponse'
              example:
                items:
                - cdrCodigo: 445566
                  name: Responsável Exemplo
                  cargo: Responsável técnico
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          description: Sessão SICAT ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
        '502':
          description: |-
            Falha ao consultar a CETESB (`CETESB_REMOTE_ERROR`, `CETESB_HTTP_ERROR`,
            `CETESB_AUTH_FAILED`, `CETESB_NON_JSON_RESPONSE`, `CETESB_NETWORK_ERROR` ou
            `CETESB_RETRY_EXHAUSTED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CodedProblem'
        '500':
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: integrationAccountId
        in: query
        required: true
        description: Conta de integração. Ausente ou vazio responde 400.
        schema:
          type: string
      - name: sessionContextId
        in: query
        required: false
        description: |-
          Contexto de sessão operacional. Presente, é validado (tem de existir e pertencer à conta —
          senão 400); ausente, a conta é apenas garantida e o gateway resolve a sessão.
        schema:
          type: string
