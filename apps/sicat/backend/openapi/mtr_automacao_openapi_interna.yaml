          description: |-
            Detalhes específicos da operação, incluindo:
            - reason: motivo do cancelamento (se aplicável)
            - requestedBy: usuário que solicitou
            - cenesStatusBefore: status anterior no sistema externo
            - cenesStatusAfter: status posterior ao processamento
            - errorCode: código de erro (se failed)
            - errorMessage: mensagem de erro (se failed)
