openapi: 3.1.0
info:
  title: Automação MTR CETESB - API Interna
  version: 1.0.0
  summary: Contrato interno para automação dos fluxos observados de cadastro, manifesto,
    recebimento, CDF, impressão, cancelamento, parceiros, catálogos, jobs e auditoria.
  description: 'OpenAPI interna derivada da especificação técnica e dos HARs analisados
    do SIGOR-MTR/CETESB. Esta API desacopla os consumidores internos da API externa
    da CETESB, padroniza idempotência, correlação, observabilidade, persistência e
    execução assíncrona.


    Fora de escopo nesta versão: qualquer automação envolvendo reCAPTCHA.'
x-cetesb-source-of-truth:
  path: docs/cetesb
  requiredHarFiles:
  - mtr.cetesb.sp.gov.br_login.har
  - mtr.cetesb.sp.gov.br_gerar_mtr.har
  - mtr.cetesb.sp.gov.br_imprimir_mtr.har
  - mtr.cetesb.sp.gov.br_cancelar_mtr.har
  - mtr.cetesb.sp.gov.br_criar_cadastro.har
  - mtr.cetesb.sp.gov.br_recebimento_mtr.har
  - mtr.cetesb.sp.gov.br_gerar_cdf_mtr.har
  - mtr.cetesb.sp.gov.br_baixar_cdf_mtr.har
  # Nota: Health endpoints (/v1/ping, /v1/health/*, /v1/maintenance/cleanup) são INTERNOS
  # e têm fonte de verdade em banco de dados local (worker_health, jobs, performance_snapshots),
  # não em HARs CETESB. Não obrigam validação de HAR.
x-internal-conversational-channel:
  description: 'As famílias Conversations, SICAT Channel Links e WhatsApp Channel NÃO têm fonte de
    verdade em HAR da CETESB e não obrigam validação de HAR. Elas são superfície interna do SICAT.'
  dataSource: 'Banco de dados local (tabelas: conversation_sessions, conversation_messages,
    conversation_artifacts, conversation_channel_links, conversation_channel_verifications, jobs) +
    API do provedor WhatsApp configurado em WHATSAPP_PROVIDER (twilio|meta).'
  hasDependency: 'O webhook e o despacho de OTP dependem do provedor WhatsApp; com
    WHATSAPP_PROVIDER=disabled (default) o webhook responde 404 e o despacho responde 503.'
x-internal-observability:
  description: 'Health endpoints são observabilidade interna do sistema.'
  dataSource: 'Banco de dados local (tabelas: worker_health, jobs, performance_snapshots, system_events)'
  hasDependency: 'Nenhuma - resilientes mesmo quando CETESB está indisponível'
servers:
- url: http://localhost:8080
  description: Servidor padrão funcional (Swagger UI e desenvolvimento local)
tags:
- name: Authentication
  description: Login e autenticação de usuários com recuperação de token JWT e dados
    do parceiro.
- name: SICAT Authentication
  description: Login inicial no SICAT e renovação de tokens da sessão SICAT.
- name: SICAT CETESB Accounts
  description: Gestão de múltiplas contas CETESB vinculadas ao usuário autenticado no SICAT.
- name: Session Contexts
  description: Contextos de sessão/autorização prontos para uso pelo conector CETESB.
- name: Admin Access
  description: Operação administrativa global para leitura de usuários, perfis, permissões e sessões.
- name: Catalogs
  description: Sincronização e consulta local de catálogos normalizados.
- name: Partners
  description: Pesquisa e resolução de parceiros por termo, documento ou código.
- name: Cadastros
  description: Solicitação e acompanhamento de cadastro de acesso/empreendimento.
- name: Manifestos
  description: Criação, submissão, recebimento, consulta, impressão e cancelamento de manifestos.
- name: CDF
  description: Geração, consulta e download de certificados de destinação final.
- name: Jobs
  description: Acompanhamento da execução assíncrona.
- name: Audit
  description: Trilha técnica sanitizada por correlationId.
- name: Health
  description: Monitoramento e observabilidade do sistema (heartbeat, métricas, jobs ativos, DLQ).
- name: Operations
  description: Visão consolidada operacional (jobs, manifestos, contas, sessões).
- name: CETESB
  description: Saúde derivada de contas e sessões CETESB (fonte local).
- name: Reports
  description: Relatórios operacionais (consulta paginada e exportação CSV).
- name: DMR
  description: Declaração de Movimentação de Resíduos (rascunho, consolidação, submissão e itens).
- name: MTR Provisorio
  description: MTR provisório emitido localmente (criação, consulta, impressão e cancelamento).
- name: Conversations
  description: Superfície conversacional do copiloto SICAT (turnos, tools, feedback e artefatos).
- name: SICAT Channel Links
  description: Vinculação de telefone ao usuário SICAT por OTP e janela de liberação de ações pelo
    WhatsApp.
- name: WhatsApp Channel
  description: Webhook público do canal WhatsApp (verificação e recepção). Autenticidade por
    assinatura HMAC do provedor, não por Bearer.
- name: Transporte - Regras
  description: Consulta read-only do catálogo regulatório da vertical Transporte (regras TR-*
    com resolução temporal por data de referência). Fonte local (`regulatory_rules` +
    `regulatory_rule_versions`), sem chamada à CETESB.
- name: Transporte - Cadastros
  description: Cadastro-base da vertical Transporte — transportadores (partes) e veículos, com
    tenancy por `integrationAccountId`, CRUD síncrono e locking otimista (`version`). Os campos
    `rntrc*` guardam o estado DECLARADO pelo operador; a verificação de regularidade via ANTT é
    Fase C (rotas `/regularidade`/`/verificar` não existem neste contrato).
- name: Transporte - Operações
  description: Agregado central `TransportOperation` — máquina de estados explícita (13 estados)
    com transições guardadas. `submeter-validacao` ORQUESTRA a avaliação do `GATE_PROPOSAL` e a
    transição resultante (`approve_validation`/`reject_validation`) no mesmo request; `contratar`
    ATIVA `GATE_CONTRACT`; `reabrir` é a transição SEM gate `blocked → draft`. As transições de
    fases C+ (CIOT, fiscal, liberação, viagem, conclusão) continuam declaradas no grafo de
    `transport-state-machine.ts` mas SEM rota. Frete sempre DECOMPOSTO (`offeredAmount`/
    `contractedAmount`/`floorAmount`/`tollAmount`/`vpoAmount`/`otherComponentsAmount`/
    `totalContractValue` — VPO nunca somado ao frete). Tenancy por `integrationAccountId`, síncrono
    (sem 202/job), locking otimista (`version`).
- name: Transporte - Conformidade
  description: Motor de compliance (`TransportComplianceService`) — avaliação síncrona de UM gate
    sobre UMA operação contra o catálogo regulatório temporal, com persistência APPEND-ONLY de
    avaliações/checks/evidências (`compliance_evaluations`/`_checks`/`_evidence`). `overallStatus`/
    `status` dos checks em MAIÚSCULO (`PASS`/`WARN`/`BLOCK`/`NOT_APPLICABLE`) — o banco/motor usam
    minúsculo internamente. `rawStatus` só aparece quando o clamp de enforcement mudou o status
    (`block` não-ACTIVE/não-`blocking` vira `warn` com `RULE_NOT_ENFORCEABLE`). Sem chamada externa
    e sem job nesta fase do programa.
- name: Transporte - Piso Mínimo
  description: 'MODO SHADOW (PR-B1): `FreightFloorEngine` calcula o piso mínimo de frete
    (`minimum = CCD*km + CC`, Lei 13.703/2018 + Res. ANTT 5.867/2020, metodologia alterada pela
    Res. ANTT 6.076/2026) e PERSISTE o resultado (APPEND-ONLY, `freight_floor_calculations`),
    atualizando `freight.floorAmount` da operação quando `outcome=calculated` — mas nada aqui vira
    bloqueante por si só (TR-PMF-002/003 seguem clampadas para WARN enquanto `blocking=false` no
    catálogo). Coeficientes REAIS da Tabela A (Res. ANTT 6.084/2026), carregados via
    `npm run load:freight-floor` como `review_status=pending_review` — a conferência jurídica
    contra o DOU é pendência P3 do guia; Tabelas B/C/D pendentes de transcrição.'
security:
- bearerAuth: []
paths:
  /v1/auth/login:
    post:
      summary: Login com usuário e senha
      description: |-
        Autentica usuário com credenciais CNPJ/CPF + senha e retorna JWT token + dados
        do parceiro.
        
        **Fluxo:**
        1. Cliente envia documento (CNPJ/CPF), senha e opcionalmente recaptchaToken
        2. Backend tenta login na CETESB (campo recaptchaToken é opcional - CETESB aceita string vazia via API backend)
        3. Se sucesso, retorna JWT token + dados completos do parceiro
        4. Cliente pode usar token para criar session context automático
        
        **Nota:** Campo recaptchaToken é aceito mas não validado pela CETESB via API backend.
        Testes práticos comprovam que CETESB aceita string vazia.
      tags:
      - Authentication
      security: []
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIzMzM5NDgiLCJuYW1lIjoiRmxhdmlvIFBhZGlsaGEgTmV0byIsInBhcnRuZXJDb2RlIjoxNzYxNjMsImlhdCI6MTcwOTg1NjAwMCwiZXhwIjoxNzA5OTQyNDAwfQ.dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
                expiresAt: '2026-03-08T23:59:59Z'
                user:
                  accessCode: 999999
                  name: Fulano de Tal
                  email: operador@exemplo.invalid
                  cpf: '12345678909'
                  document: '12345678000195'
                  documentType: J
                partner:
                  code: 900001
                  description: Empresa Exemplo LTDA
                  tradeName: Empresa Exemplo LTDA
                  document: '12345678000195'
                  state:
                    code: 26
                    abbreviation: SP
        '400':
          description: Credenciais inválidas ou reCAPTCHA não resolvido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalidCredentials:
                  summary: Usuário ou senha incorretos
                  value:
                    type: https://api.exemplo.local/problems/invalid-credentials
                    title: Credenciais Inválidas
                    status: 400
                    code: INVALID_CREDENTIALS
                    detail: Usuário ou senha incorretos. Verifique CNPJ/CPF e senha.
                    correlationId: corr_login_001
        '500':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              cnpjLogin:
                summary: Login com CNPJ
                value:
                  document: '12345678000195'
                  password: senha-de-exemplo
                  recaptchaToken: 03AGdBq24PBCd...XYZ
              cpfLogin:
                summary: Login com CPF
                value:
                  document: '12345678909'
                  password: senha-de-exemplo
                  recaptchaToken: ''
              emailLogin:
                summary: Login com Email (se suportado)
                value:
                  document: operador@exemplo.invalid
                  password: senha-de-exemplo
                  recaptchaToken: ''
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
  /v1/auth/partner-info:
    get:
      summary: Buscar informações do parceiro por documento
      description: |-
        Consulta dados do parceiro (código, nome, estado) a partir de CNPJ ou CPF
        **sem necessidade de autenticação prévia**. Útil para preencher formulários
        antes do login.
        
        Este endpoint consulta a base local ou faz lookup na CETESB dependendo
        da disponibilidade de cache.
      tags:
      - Authentication
      responses:
        '200':
          description: Dados do parceiro encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerInfo'
              example:
                partnerCode: 900001
                description: Empresa Exemplo LTDA
                tradeName: Empresa Exemplo LTDA
                document: '12345678000195'
                documentType: J
                state:
                  code: 26
                  abbreviation: SP
                registeredUsers:
                - accessCode: 999999
                  name: Fulano de Tal
                  email: operador@exemplo.invalid
                  cpf: '12345678909'
        '404':
          description: Parceiro não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.exemplo.local/problems/partner-not-found
                title: Parceiro Não Encontrado
                status: 404
                code: PARTNER_NOT_FOUND
                detail: Nenhum parceiro encontrado para o documento 12345678000195
                correlationId: corr_partner_lookup_001
        '401':
          description: Sessão SICAT ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
      parameters:
      - name: document
        in: query
        required: true
        description: CNPJ, CPF ou email do parceiro
        schema:
          type: string
        example: '12345678000195'
      - $ref: '#/components/parameters/CorrelationId'
  /v1/sicat/auth/login:
    post:
      summary: Login inicial no SICAT
      description: Autentica o usuário no SICAT (email + senha) e retorna tokens da
        sessão SICAT para o fluxo de dupla autenticação.
      tags:
      - SICAT Authentication
      security: []
      responses:
        '200':
          description: Login SICAT bem-sucedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SicatLoginResponse'
              example:
                accessToken: sicat_access_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                refreshToken: sicat_refresh_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                expiresAt: '2026-03-13T18:00:00Z'
                user:
                  userId: usr_01JQWABCDEF1234567890
                  name: Fulano de Tal
                  email: operador@exemplo.invalid
                  roles:
                  - operator
        '400':
          description: Requisição inválida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Credenciais inválidas
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Falha interna
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SicatLoginRequest'
            example:
              email: operador@exemplo.invalid
              password: super-secret-password
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
  /v1/sicat/auth/register:
    post:
      summary: Registrar novo usuário SICAT
      description: Cria um usuário SICAT e já retorna tokens da sessão para continuar
        o fluxo de autenticação.
      tags:
      - SICAT Authentication
      security: []
      responses:
        '201':
          description: Usuário SICAT criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SicatLoginResponse'
              example:
                accessToken: sicat_access_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                refreshToken: sicat_refresh_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                expiresAt: '2026-03-13T18:00:00Z'
                user:
                  userId: usr_01JQWABCDEF1234567890
                  name: Fulano de Tal
                  email: operador@exemplo.invalid
                  roles:
                  - operator
        '400':
          description: Requisição inválida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Usuário já cadastrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Falha interna
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SicatRegisterRequest'
            example:
              name: Fulano de Tal
              email: operador@exemplo.invalid
              password: super-secret-password
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
  /v1/sicat/auth/refresh:
    post:
      summary: Renovar sessão SICAT
      description: Renova a sessão do usuário SICAT emitindo novo par de tokens.
      tags:
      - SICAT Authentication
      security: []
      responses:
        '200':
          description: Tokens renovados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SicatRefreshResponse'
              example:
                accessToken: sicat_access_new_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                refreshToken: sicat_refresh_new_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                expiresAt: '2026-03-13T20:00:00Z'
        '400':
          description: Requisição inválida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Refresh token inválido ou expirado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SicatRefreshRequest'
            example:
              refreshToken: sicat_refresh_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
  /v1/sicat/auth/keycloak:
    post:
      summary: Login no SICAT via SSO Keycloak (OIDC)
      description: |-
        Troca um `access_token` do Keycloak (realm `nvit`, obtido pelo frontend em Authorization Code
        + PKCE) pela MESMA sessão que `POST /v1/sicat/auth/login` emite — mesmo par de tokens, mesmo
        `SicatLoginResponse`. É ADITIVO: o login local continua como fallback e a autenticação
        SIGOR/CETESB não é tocada.

        Validação: o token é apresentado ao `/userinfo` do realm, então só tokens deste IdP passam. O
        usuário SICAT é provisionado por e-mail no primeiro login via SSO (com senha aleatória, que o
        SSO nunca usa); corrida de cadastro (`23505`) é reabsorvida relendo o usuário por e-mail.

        `security: []` não é descuido: o access token do Keycloak vai no CORPO e É a credencial —
        não há como exigir Bearer de quem ainda não tem sessão SICAT. Esta é a razão de a rota NÃO
        passar pelo `sicatAuthMiddleware`, e ela está na allowlist FECHADA de
        `tests/api/v1-auth-coverage.test.js`, ao lado de `login`, `register` e `refresh`.
      tags:
      - SICAT Authentication
      security: []
      responses:
        '200':
          description: Sessão SICAT emitida a partir do token do Keycloak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SicatLoginResponse'
              example:
                accessToken: sicat_access_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                refreshToken: sicat_refresh_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                expiresAt: '2026-03-13T18:00:00Z'
                user:
                  userId: usr_01JQWABCDEF1234567890
                  name: Fulano de Tal
                  email: operador@exemplo.invalid
                  roles:
                  - operator
        '400':
          description: '`accessToken` ausente ou vazio no corpo (`MISSING_KEYCLOAK_TOKEN`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CodedProblem'
        '401':
          description: |-
            Token do Keycloak inválido ou expirado (`INVALID_KEYCLOAK_TOKEN`), claims sem e-mail
            (`KEYCLOAK_NO_EMAIL`) ou usuário SICAT inativo (`INVALID_SICAT_USER`). Este 401 SEMPRE
            traz `code` (por isso `CodedProblem`, e não `UnauthorizedProblem`): quem o emite é o
            handler, com `AppError`, e não o gate de Bearer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CodedProblem'
        '502':
          description: Falha ao falar com o `/userinfo` do Keycloak (`KEYCLOAK_UNAVAILABLE`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CodedProblem'
        '500':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SicatKeycloakLoginRequest'
            example:
              accessToken: keycloak_access_eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
  /v1/sicat/cetesb-accounts:
    get:
      summary: Listar contas CETESB vinculadas ao usuário SICAT
      description: Retorna cards operacionais para seleção de conta CETESB ativa no
        fluxo de dupla autenticação.
      tags:
      - SICAT CETESB Accounts
      responses:
        '200':
          description: Lista de contas vinculadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SicatCetesbAccountsListResponse'
              example:
                activeAccountId: acc_01JQWACCOUNT0001
                accounts:
                - accountId: acc_01JQWACCOUNT0001
                  partnerCode: 900001
                  partnerDocument: 31.913.781/0001-39
                  partnerName: Empresa Exemplo LTDA
                  accountType: generator
                  lastConnectionAt: '2026-03-13T14:10:00Z'
                  lastUsageAt: '2026-03-13T14:52:11Z'
                  usageSummary:
                    manifestsCreated: 25
                    manifestsSubmitted: 22
                    manifestsPrinted: 18
                    manifestsCancelled: 1
                  isActive: true
                - accountId: acc_01JQWACCOUNT0002
                  partnerCode: 221010
                  partnerDocument: 12.***.***/0001-**
                  partnerName: Transportes XPTO
                  accountType: carrier
                  lastConnectionAt: '2026-03-10T09:20:00Z'
                  lastUsageAt: '2026-03-11T08:15:00Z'
                  usageSummary:
                    manifestsCreated: 4
                    manifestsSubmitted: 4
                    manifestsPrinted: 2
                    manifestsCancelled: 0
                  isActive: false
        '401':
          description: Sessão SICAT inválida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      summary: Vincular nova conta CETESB ao usuário SICAT
      description: Adiciona uma conta CETESB ao usuário SICAT usando credenciais CETESB
        para autenticação e vínculo.
      tags:
      - SICAT CETESB Accounts
      responses:
        '201':
          description: Conta CETESB vinculada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SicatCetesbAccountCard'
              example:
                accountId: acc_01JQWACCOUNT0003
                partnerCode: 778899
                partnerDocument: 45.123.456/0001-90
                partnerName: Destino Ambiental Ltda
                accountType: receiver
                lastConnectionAt: '2026-03-13T15:10:00Z'
                lastUsageAt: null
                usageSummary:
                  manifestsCreated: 0
                  manifestsSubmitted: 0
                  manifestsPrinted: 0
                  manifestsCancelled: 0
                isActive: false
        '400':
          description: Dados inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Sessão SICAT inválida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conta CETESB já vinculada para este usuário
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SicatCetesbAccountCreateRequest'
            example:
              login: '12345678000195'
              password: senha-de-exemplo
              email: operador@exemplo.invalid
              partnerCode: 900001
              recaptchaToken: ''
