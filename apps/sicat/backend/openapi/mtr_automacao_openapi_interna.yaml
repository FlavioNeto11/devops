  /v1/health/jobs/dlq/{jobId}/requeue:
    post:
      summary: Reprocessar job da DLQ
      description: |-
        Devolve o job da DLQ para a fila: `status = 'queued'`, `attempts = 0`, `next_retry_at`,
        `started_at`, `finished_at` e as marcas de DLQ zerados, e a linha some de
        `job_dead_letter_queue`. O `jobId` é PRESERVADO — difere de `POST /v1/jobs/{jobId}/retry`,
        que para `failed`/`cancelled` cria um job novo.

        Concorrência: lock otimista (DL-022) sobre `status = 'dlq' and version = <atual>`; entre dois
        requeues simultâneos, só um tem efeito. O perdedor, e também o job que já saiu de `dlq`,
        chegam ao cliente como 500 — hoje esses conflitos são `Error` puro, não `AppError` com 409.
      tags:
      - Health
      responses:
        '200':
          description: Job reenfileirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthJobRequeueResponse'
              example:
                jobId: job_01JQW5M0D2G3CTQYV4N9AB8F1R
                status: queued
                message: Job requeued successfully
        '401':
          description: Sessão SICAT ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
        '404':
          description: |-
            Job inexistente na DLQ.

            Dois avisos que valem mais que a forma do corpo:

            1. O corpo é `application/json` `{"message": ...}`, e NÃO `application/problem+json`: a
               rota monta este 404 inline, sem passar pelo `errorHandlerMiddleware`. É a única
               resposta de erro desta família fora do padrão problem+json.
            2. Este é o comportamento PRETENDIDO, ainda não o observado. Hoje `requeueFromDLQ`
               (`src/repositories/job-repo.ts`) lança `Error` puro quando o job não está na DLQ, o
               handler global o converte em 500 e o ramo `if (!job)` da rota fica inalcançável. A
               correção do repositório vem em mudança separada; este 404 só passa a ser verdade
               quando ela entrar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthJobRequeueNotFound'
              example:
                message: Job not found
        '500':
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: jobId
        in: path
        required: true
        schema:
          type: string
  /v1/health/jobs/dlq/{jobId}:
    delete:
      summary: Descartar job da DLQ
      description: |-
        Purga definitiva: apaga a linha de `job_dead_letter_queue` e marca o job original como
        `failed` (só quando ele ainda estiver em `dlq`), para que nenhum worker o retome.

        IDEMPOTENTE e SEM 404: `jobId` inexistente também responde 204. Os dois comandos são um
        `delete` e um `update` sem checagem de linhas afetadas — não há como a rota distinguir
        "descartei" de "não havia nada para descartar", e não vale inventar um 404 que o código não
        emite.
      tags:
      - Health
      responses:
        '204':
          description: Job descartado (sem corpo). Também é a resposta para `jobId` inexistente.
        '401':
          description: Sessão SICAT ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
        '500':
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: jobId
        in: path
        required: true
        schema:
          type: string
