acceptance_criteria:
  - "POST/GET /v1/transporte/gr/screenings para motorista OU veículo com outcome e valid_until; trilha append-only por tentativa; payload mínimo (sem antecedentes)."
  - "Matriz de rastreamento declarativa no PGR (thresholds por valor declarado); confirmação de rastreamento por operação (uma ativa)."
  - "TR-GR-001 e TR-GR-002 avaliadas no gate de pré-embarque como advisory (blocking=false no seed); domínio GR aceito pelo catálogo regulatório."
