id: REQ-SICAT-0036
slug: req-sicat-0036
title: "Transporte: gerenciamento de riscos — pesquisa cadastral e rastreamento por matriz do PGR"
type: functional
status: draft
owner: plataforma-digital
scope:
  applies_to: product
  product_scope: sicat
  domain: transporte
statement: >-
  O sistema deve executar as exigências de gerenciamento de riscos das seguradoras: pesquisa
  cadastral de motorista e de veículo através de um gateway de screening abstraído (modos
  off|sandbox, padrão DL-102 com marcador de correlação), com resultado
  aprovado|reprovado|inconclusivo e validade, em trilha append-only por tentativa e payload mínimo
  (LGPD — nunca antecedentes detalhados); e a exigência de rastreamento derivada de uma matriz
  declarativa no PGR (por valor/tipo de mercadoria) com confirmação de rastreamento por operação.
  Regras advisory no gate de pré-embarque: TR-GR-001 (screening válido de motorista e veículo
  quando há apólice de roubo ativa) e TR-GR-002 (rastreamento exigido pela matriz e não
  confirmado). O domínio GR entra no catálogo regulatório.
business_rationale: >-
  As seguradoras condicionam as apólices de roubo à pesquisa cadastral em empresas especializadas
  e a rastreamento conforme a mercadoria (doc Irmãos PADILHA, item 4). Sem GR em dia a apólice
  fica em risco — o produto precisa mostrar isso antes da viagem.
source:
  stakeholder: sicat
  origin: fluxo do prospect Irmãos PADILHA (2026-08-11) + plano 2026-08-15
  source_paths:
