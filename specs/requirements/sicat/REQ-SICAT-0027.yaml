id: REQ-SICAT-0027
slug: req-sicat-0027
title: "Transporte: importação e validação de NF-e/CT-e/MDF-e com schema registry e vínculos"
type: functional
status: draft
owner: plataforma-digital
scope:
  applies_to: product
  product_scope: sicat
  domain: transporte
statement: >-
  O sistema deve importar, validar e relacionar documentos fiscais eletrônicos (NF-e, CT-e, MDF-e)
  a operações de transporte — chave de acesso, XML com hash e referência de storage, versão de
  schema e de Nota Técnica, status de autorização, protocolo, vínculos CIOT↔MDF-e e VPO↔MDF-e —
  usando um schema registry versionado (nenhuma regra XML depende de schema "eterno"); emissão
  fiscal fica explicitamente fora deste requisito (ver REQ-SICAT-0029).
business_rationale: >-
  Começar por importação+validação reduz drasticamente o risco da primeira entrega fiscal e
  antecipa em teste as rejeições da NT MDF-e 2026.001 (CIOT no MDF-e) antes de o ambiente de
  produção recusá-las (baseline deep-research 2026-08-13, "NF-e, CT-e e MDF-e"). Fase E do
  programa.
source:
  stakeholder: sicat
  origin: deep-research 2026-08-13 (baseline regulatória aceita) + plano do programa Transporte
