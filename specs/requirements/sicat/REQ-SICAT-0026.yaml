id: REQ-SICAT-0026
slug: req-sicat-0026
title: "Transporte: Vale-Pedágio Obrigatório — applicability engine, antecipação e evidência"
type: functional
status: draft
owner: plataforma-digital
scope:
  applies_to: product
  product_scope: sicat
  domain: transporte
statement: >-
  O sistema deve determinar a aplicabilidade do Vale-Pedágio Obrigatório por operação (VPO não é
  checkbox universal — Lei 10.209/2001 e Res. ANTT 6.024/2023 têm hipóteses e exceções), exigir
  antecipação separada do frete quando aplicável (provedor habilitado, referência, valor,
  evidência e vínculo com MDF-e quando tecnicamente exigido) e registrar justificativa auditável
  também quando NOT_APPLICABLE; o valor do VPO permanece sempre separado do valor do frete.
business_rationale: >-
  Erro clássico de produto é somar pedágio ao frete e perder a distinção; até a regra
  NOT_APPLICABLE precisa deixar evidência do motivo (baseline deep-research 2026-08-13,
  "Vale-Pedágio Obrigatório"). Fornecedoras habilitadas são cadastro configurável, nunca
  hardcoded. Fase D do programa.
