acceptance_criteria:
  - "POST/GET/PATCH /v1/transporte/motoristas com CNH (número, categoria válida, validade) sobre parte PF com papel driver; tenancy por integration_account_id."
  - "Vínculo motorista↔transportador com link_type fleet|aggregated e vigência; no máximo um vínculo vigente por par e tipo."
  - "GET de transportadores expõe derivedTypology (driver_pf|tac|etc) e fleetSize calculados da frota owned+leased ativa; divergência declarado×derivado gera aviso não bloqueante."
verification_method: [test-unit, test-integration]
