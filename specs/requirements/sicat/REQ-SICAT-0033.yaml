id: REQ-SICAT-0033
slug: req-sicat-0033
title: "Transporte: motoristas com CNH e vínculo frota/agregado; tipologia TAC/ETC derivada"
type: functional
status: draft
owner: plataforma-digital
scope:
  applies_to: product
  product_scope: sicat
  domain: transporte
statement: >-
  O sistema deve cadastrar motoristas como extensão 1:1 de partes PF (CNH com número, categoria e
  validade) e o vínculo do motorista com o transportador (frota × agregado, com vigência), e deve
  derivar a tipologia do transportador a partir da frota ativa (motorista PF / TAC até 3 veículos /
  ETC 4 ou mais), expondo tipologia derivada e tamanho de frota na consulta do transportador com
  aviso de divergência entre categoria declarada e derivada (validação de serviço, sem regra TR
  bloqueante neste ciclo).
business_rationale: >-
  O circuito do TRC (doc Irmãos PADILHA) distingue motorista PF, TAC (até 3 caminhões) e ETC (4+,
  que emite CIOT e contrata seguro), e o gerenciamento de riscos das seguradoras exige pesquisa
  cadastral do MOTORISTA — que hoje não existe como entidade (apenas o papel driver, sem CNH).
source:
  stakeholder: sicat
  origin: fluxo do prospect Irmãos PADILHA (2026-08-11) + plano 2026-08-15
  source_paths:
    - apps/sicat/docs/30-transporte/transporte-guia.md
priority: high
criticality: medium
architectural_significance: false
capability_blocks:
