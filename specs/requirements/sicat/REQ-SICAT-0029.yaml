id: REQ-SICAT-0029
slug: req-sicat-0029
title: "Transporte: emissão fiscal DF-e (condicional a go/no-go comercial)"
type: functional
status: draft
owner: plataforma-digital
scope:
  applies_to: product
  product_scope: sicat
  domain: transporte
statement: >-
  Condicionado a decisão comercial explícita (go/no-go) e ADR próprio, o sistema deve emitir
  documentos fiscais eletrônicos (CT-e/MDF-e e, quando pertinente, NF-e) com gestão de
  certificados digitais, assinatura, submissão à SEFAZ, contingência, eventos fiscais e
  encerramento — avaliando o reuso do pacote compartilhado @flavioneto11/fiscal-kit
  (packages/fiscal-kit, sandbox-first) como fundação do gateway fiscal.
business_rationale: >-
  Emissão fiscal completa envolve certificados, contingência, particularidades estaduais e
  operação de alta criticidade — deliberadamente separada da importação/validação (REQ-SICAT-0027)
  para não concentrar risco em uma única release (baseline deep-research 2026-08-13, "Documentos
  fiscais"). Fase G do programa.
