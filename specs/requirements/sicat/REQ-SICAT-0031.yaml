id: REQ-SICAT-0031
slug: req-sicat-0031
title: "Transporte: Centro Operacional com buckets e métricas da vertical"
type: functional
status: draft
owner: plataforma-digital
scope:
  applies_to: product
  product_scope: sicat
  domain: transporte
statement: >-
  O sistema deve estender o Centro Operacional existente do SICAT (não criar um segundo framework
  de observabilidade) com os buckets e métricas da vertical Transporte: saúde por integração
  (ANTT, provedor CIOT, SEFAZ, VPO, seguros), operações criadas/bloqueadas, bloqueios por regra,
  ofertas abaixo do piso impedidas, CIOTs pendentes/falhos, divergências MDF-e, RNTRC irregulares,
  seguros vencendo, jobs em retry/DLQ por integração, tempo de liberação e regras regulatórias
  próximas de mudança de vigência.
business_rationale: >-
  O Centro Operacional já oferece jobs/retry/DLQ/auditoria/health/relatórios; a vertical nova se
  encaixa nos mesmos registries de status operacional (baseline deep-research 2026-08-13,
  "Hardening e Centro Operacional"). Entrega incremental nas fases C–H.
