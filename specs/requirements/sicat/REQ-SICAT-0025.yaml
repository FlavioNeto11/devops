id: REQ-SICAT-0025
slug: req-sicat-0025
title: "Transporte: ciclo completo do CIOT com provedor abstraído"
type: functional
status: draft
owner: plataforma-digital
scope:
  applies_to: product
  product_scope: sicat
  domain: transporte
statement: >-
  O sistema deve suportar o ciclo completo do CIOT (pré-validação → solicitação → registro →
  retificação → cancelamento → encerramento, incluindo rejeição e bloqueio) por meio de adapters
  de provedor (nunca dependência direta de fornecedor único), registrando participantes, carga,
  origem/destino, frete, forma e prazo de pagamento, requests/responses auditáveis, idempotência e
  vínculo com MDF-e; CIOT registrado nunca é tratado como sinônimo de operação regular
  (REGISTERED ≠ COMPLIANT).
business_rationale: >-
  CIOT universalizado desde 24/05/2026 (Res. ANTT 6.078/2026) e reforçado pela Lei 15.485/2026
  (registro prévio, responsabilidade pela geração, vínculo ao MDF-e, multa por ausência). A
  identidade remota nasce na resposta do provedor: aplicar o padrão marcador de correlação +
  estado *_unconfirmed + reconciliador (DL-102) desde o dia 1 (baseline deep-research 2026-08-13,
  "CIOT e pagamento do frete"). Fase C do programa.
source:
  stakeholder: sicat
  origin: deep-research 2026-08-13 (baseline regulatória aceita) + plano do programa Transporte
  source_paths:
