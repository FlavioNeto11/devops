id: REQ-SICAT-0037
slug: req-sicat-0037
title: "Transporte: UI de seguros, GR, motoristas e habilitação do módulo do Transportador"
type: functional
status: draft
owner: plataforma-digital
scope:
  applies_to: product
  product_scope: sicat
  domain: transporte
statement: >-
  O frontend do módulo do Transportador deve cobrir o circuito comercial de seguros com telas
  dedicadas: Apólices consolidada (vigência, limite de garantia por viagem, taxa % e mínimo mensal
  — reaproveitando o CRUD por transportador existente, sem duplicá-lo), Averbações (lista por
  período/status; ação primária de averbar no card "Seguro da viagem" do detalhe da operação, com
  checagem visual limite × valor da carga e linha do tempo), Apuração mensal (extrato com
  max(apurado, mínimo) explicado), Gerenciamento de risco (screenings de motorista/veículo e
  rastreamento), Motoristas (CNH com validade, vínculo frota/agregado) e Minha habilitação (RNTRC
  com verificar-agora e tipologia PF/TAC/ETC didática). Estados via SicatStatusBadge com domínios
  novos no status-map; feedback via useNotification; ajuda inline nos campos-chave.
business_rationale: >-
  As capacidades novas de backend (REQ-SICAT-0033..0036) só viram produto vendável com as telas
  que contam a história — o diagrama do prospect pede um "sistema de gestão de transportadora"
  com os ramos fiscal e seguros visíveis e acionáveis.
source:
