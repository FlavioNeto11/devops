acceptance_criteria:
  - "Telas Apólices/Averbações/Apuração/GR/Motoristas/Habilitação navegáveis pelos grupos do módulo, todas em SicatPageLayout com domínios de status novos (insurance-policy, averbacao, gr-screening, driver-cnh) no status-map."
  - "Detalhe da operação ganha card 'Seguro da viagem' (componente filho) com checagem limite×carga, ação Averbar e próximos passos; nenhuma duplicação do CRUD de apólices por transportador."
  - "Apuração exibe extrato do mês com valor = max(apurado, mínimo) e explica quando o mínimo prevalece; caso de ouro R$ 24,25 visível no extrato de teste."
