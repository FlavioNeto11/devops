acceptance_criteria:
  - "GET /v1/transporte/seguros/apuracao?period=YYYY-MM lista os períodos por apólice; GET do período devolve o extrato (averbações com valor, taxa e prêmio) e billed = greatest(premium_total, minimum) com billing_basis."
  - "Sweep diária enfileira o fechamento do mês anterior por apólice com averbações ou mínimo > 0, com deduplicação de job; recálculo de período aberto é idempotente e grava execução append-only."
  - "Período fechado só reabre por ação administrativa explícita com trilha."
verification_method: [test-unit, test-integration]
