id: REQ-SICAT-0035
slug: req-sicat-0035
title: "Transporte: apuração mensal do prêmio de averbação contra custo mínimo"
type: functional
status: draft
owner: plataforma-digital
scope:
  applies_to: product
  product_scope: sicat
  domain: transporte
statement: >-
  O sistema deve apurar mensalmente, por apólice, o prêmio das averbações do período: total de
  carga averbada, soma dos prêmios, custo mínimo mensal da tabela de taxas vigente no fechamento e
  valor do mês = maior entre soma dos prêmios e mínimo (com a base registrada: premium|minimum).
  O fechamento roda como job mensal na fila (sweep diária fecha o mês anterior, deduplicada), o
  recálculo de período aberto é idempotente, cada recálculo grava uma execução append-only com
  entradas e resultado (reprodutibilidade), e o extrato lista as averbações incluídas.
business_rationale: >-
  As apólices do TRC têm custo mínimo mensal (ex.: R$ 700 RCTR-C/RC-DC, R$ 300 RC-V): no fim do
  mês a seguradora cobra max(transportado × taxa, mínimo) — doc Irmãos PADILHA. A transportadora
  precisa ver essa conta ANTES da fatura da seguradora.
source:
  stakeholder: sicat
  origin: fluxo do prospect Irmãos PADILHA (2026-08-11) + plano 2026-08-15
  source_paths:
    - apps/sicat/docs/30-transporte/transporte-guia.md
priority: high
criticality: medium
architectural_significance: false
capability_blocks:
