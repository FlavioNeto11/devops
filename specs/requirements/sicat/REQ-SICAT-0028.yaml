  - "Apólice aceita limite de garantia por viagem (per_trip_limit_amount) configurável; ausência do limite gera aviso, nunca bloqueio."
  - "TR-SEG-004 no gate de pré-embarque: soma dos valores declarados da carga acima do limite da apólice → block bruto (rebaixado pelo clamp advisory), com valores na evidência; carga sem valor declarado → warn."
  - "Alertas de expiração continuam cobrindo as 3 coberturas; LGPD preservada — nunca condições comerciais completas."
