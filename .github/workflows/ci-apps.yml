# =============================================================================
# ci-apps — gate estatico por app (lint / typecheck / build) + sync de lockfile
#           + smoke de Dockerfile alterado
# -----------------------------------------------------------------------------
# Roda em PR e push para main quando muda apps/**. ESCOPADO: um job `detect`
# descobre QUAIS apps mudaram (git diff) e a matrix roda SÓ esses — em vez de
# rodar os 8 apps a cada mudanca em qualquer app (o que inflava a fila hosted do
# GitHub e ajudava a estourar o throttle). Mudanca no proprio workflow OU
# workflow_dispatch => roda TODOS (conservador). Verificacoes ESTATICAS de cada
# app dependem so do codigo do proprio app (deps sao vendoradas), entao escopar
# por pasta do app e seguro (nao ha under-trigger).
#
# NB: os jobs por-app NAO sao required na main (so "Validar requisitos e baseline"
# e "Reqhub gate" sao) — pular apps nao alterados nao bloqueia o merge.
#
# Runners: ubuntu-latest para os gates estaticos; o docker-smoke roda no runner
# SELF-HOSTED (Docker Desktop desta maquina) para aproveitar o cache de camadas
# persistente — build tipico em segundos.
# =============================================================================
name: ci-apps

# Forca as JS actions (docker/*, pnpm/*, etc.) a rodarem em Node 24, eliminando
# os avisos de deprecacao do Node 20 antes da troca forcada (~jun/2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/**"
      - ".github/workflows/ci-apps.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/ci-apps.yml"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # detect — calcula a matrix (lista de apps a verificar) a partir do git diff.
  # Saida `include` = JSON com as entradas da matrix dos apps cujo apps/<path>/
  # mudou. Vazio ([]) => o job `apps` e pulado.
  # ---------------------------------------------------------------------------
  detect:
    name: detectar apps alterados
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.f.outputs.include }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Tabela canonica dos apps (path = subpasta de apps/ com o package.json).
          cat > "$RUNNER_TEMP/apps.json" <<'JSON'
          [
            {"app":"sicat","path":"sicat","pm":"npm","prep":"","checks":"lint test:unit:frontend build:frontend"},
            {"app":"gymops","path":"gymops","pm":"pnpm","prep":"pnpm --filter @gymops/db run generate && pnpm --filter \"./packages/*\" run build","checks":"lint typecheck"},
            {"app":"rmambiental","path":"rmambiental","pm":"npm","prep":"","checks":"build"},
            {"app":"anarabottini","path":"anarabottini","pm":"npm","prep":"","checks":"typecheck build"},
            {"app":"portal-recorder-api","path":"portal-recorder/api","pm":"npm","prep":"","checks":"test"},
            {"app":"portal-recorder-frontend","path":"portal-recorder/frontend","pm":"npm","prep":"","checks":"build"},
            {"app":"ai-control-plane-api","path":"ai-control-plane/api","pm":"npm","prep":"","checks":"test"},
            {"app":"reqhub-api","path":"reqhub/api","pm":"npm","prep":"","checks":"test"},
            {"app":"besc-api","path":"besc/api","pm":"npm","prep":"","checks":"test"},
            {"app":"zapbridge-server","path":"zapbridge/server","pm":"npm","prep":"npx prisma generate","checks":"build"}
          ]
          JSON

          run_all=0
          [ "$EVENT" = "workflow_dispatch" ] && run_all=1
          if [ "$EVENT" = "pull_request" ]; then base="${BASE_SHA:-}"; else base="${BEFORE_SHA:-}"; fi
          if [ -z "$base" ] || ! git rev-parse -q --verify "$base^{commit}" >/dev/null 2>&1; then
            run_all=1
          fi

          changed=""
          if [ "$run_all" = "0" ]; then
            changed="$(git diff --name-only "$base" HEAD || true)"
            # mudanca no proprio workflow => roda todos (conservador)
            if printf '%s\n' "$changed" | grep -qx '.github/workflows/ci-apps.yml'; then run_all=1; fi
          fi

          if [ "$run_all" = "1" ]; then
            inc="$(jq -c . "$RUNNER_TEMP/apps.json")"
          else
            inc="$(jq -c --arg ch "$changed" '
              ($ch | split("\n") | map(select(length > 0))) as $files
              | [ .[] | . as $e | select($files | any(startswith("apps/" + $e.path + "/"))) ]
            ' "$RUNNER_TEMP/apps.json")"
          fi
          echo "apps selecionados: $inc"
          echo "include=$inc" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # req-traceability — gate WARNING-FIRST (F8 Forja 4.1): PR que muda o codigo
  # de um app COM contrato de produto (specs/products/<name>/product.json) sem
  # citar um REQ-*/REF-* (titulo, corpo, branch) e sem tocar specs/** ganha um
  # ::warning por app. NUNCA falha o PR — o objetivo e criar o habito de ligar
  # mudanca a requisito (fonte da verdade), nao bloquear hotfix. A lista de
  # produtos e derivada de specs/products/ em runtime (adoções futuras entram
  # sozinhas, ex.: imobia/zapbridge/besc-next).
  # ---------------------------------------------------------------------------
  req-traceability:
    name: rastreabilidade REQ (warning)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || ! git rev-parse -q --verify "$BASE_SHA^{commit}" >/dev/null 2>&1; then
            echo "base do PR indisponivel — pulando (warning-first)"; exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" HEAD || true)"
          # PR que ja toca a base de requisitos esta rastreado por definicao.
          if printf '%s\n' "$changed" | grep -q '^specs/'; then
            echo "PR toca specs/** — rastreabilidade ok"; exit 0
          fi
          reftext="$PR_TITLE
          $PR_BODY
          $PR_BRANCH"
          has_ref=0
          if printf '%s' "$reftext" | grep -qE 'RE[QF]-[A-Z0-9]+-[0-9]+'; then has_ref=1; fi
          missing=""
          for pj in specs/products/*/product.json; do
            [ -f "$pj" ] || continue
            name="$(basename "$(dirname "$pj")")"
            if printf '%s\n' "$changed" | grep -q "^apps/$name/" && [ "$has_ref" = "0" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::warning title=PR de app sem REQ::Este PR altera app(s) de produto ($missing ) sem citar um REQ-*/REF-* no titulo/corpo/branch e sem tocar specs/**. Ligue a mudanca a um requisito (ou crie um via /reqs) — a base de requisitos e a fonte da verdade."
          else
            echo "rastreabilidade ok"
          fi

  # ---------------------------------------------------------------------------
  # lockfile-sync — pega o package-lock fora de sync ONDE O DOCKERFILE o usa.
  # O job `apps` instala na RAIZ do app (workspace); os Dockerfiles rodam
  # `npm ci` no diretorio do SERVICO com o lockfile standalone dele — superficies
  # DIFERENTES. Incidente real (2026-08-15): fiscal-kit entrou no package.json do
  # sicat/backend sem atualizar o lock; `npm ci` da imagem quebrava com EUSAGE
  # havia ~12h com o CI verde (PR #338). Este job AUTODESCOBRE todo
  # package-lock.json sob os apps alterados (sem tabela para manter) e roda
  # `npm ci --dry-run` no diretorio — valida lock↔manifest em segundos, sem
  # instalar nada.
  # ---------------------------------------------------------------------------
  lockfile-sync:
    name: lockfile em sync (npm ci --dry-run)
    needs: detect
    if: needs.detect.outputs.include != '' && needs.detect.outputs.include != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - shell: bash
        env:
          INCLUDE: ${{ needs.detect.outputs.include }}
        run: |
          set -euo pipefail
          fails=""
          for p in $(printf '%s' "$INCLUDE" | jq -r '.[].path'); do
            while IFS= read -r lock; do
              dir="$(dirname "$lock")"
              echo "::group::npm ci --dry-run em $dir"
              if ! (cd "$dir" && npm ci --dry-run --ignore-scripts --no-audit --no-fund); then
                fails="$fails $dir"
              fi
              echo "::endgroup::"
            done < <(find "apps/$p" -maxdepth 3 -name package-lock.json -not -path '*/node_modules/*')
          done
          if [ -n "$fails" ]; then
            echo "::error title=package-lock fora de sync::npm ci falharia no Dockerfile de:$fails — rode 'npm install --package-lock-only' no(s) diretorio(s) e commite o lockfile."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # docker-smoke — builda a imagem quando o PROPRIO Dockerfile mudou.
  # Complementa o lockfile-sync: erro de sintaxe/COPY/stage no Dockerfile so
  # aparecia no deploy manual. Roda no runner self-hosted (Docker Desktop desta
  # maquina): o cache de camadas PERSISTE entre execucoes, entao o custo típico
  # e segundos — e o build ja pre-aquece as camadas do proximo publish local.
  # Escopo deliberado: so dispara quando um apps/**/Dockerfile* muda (raro);
  # regressao de COPY por rename de pasta SEM tocar o Dockerfile continua
  # descoberta (trade-off documentado — o gate completo seria buildar sempre).
  # Tag ci-smoke/* para NUNCA sobrescrever as imagens <svc>:local em uso.
  # ---------------------------------------------------------------------------
  docker-smoke:
    name: docker build (Dockerfiles alterados)
    needs: detect
    if: needs.detect.outputs.include != '' && needs.detect.outputs.include != '[]'
    runs-on: [self-hosted, windows, docker-desktop, local-k8s, flavio-devops]
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Buildar Dockerfiles alterados
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          $base = if ($env:EVENT -eq 'pull_request') { $env:BASE_SHA } else { $env:BEFORE_SHA }
          $null = git rev-parse -q --verify "$base^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host 'base indisponivel - nada a buildar'; exit 0 }
          $changed = git diff --name-only $base HEAD |
            Where-Object { $_ -match '^apps/.*/Dockerfile[^/]*$' }
          if (-not $changed) { Write-Host 'nenhum Dockerfile alterado - ok'; exit 0 }

          # Contexto de build: por convencao = diretorio do Dockerfile; excecoes
          # (monorepo pnpm do gymops precisa da raiz do app; o Dockerfile raiz do
          # reqhub assa specs/baseline e usa a RAIZ do repo).
          $ctxMap = @{
            'apps/gymops/apps/web/Dockerfile' = 'apps/gymops'
            'apps/gymops/apps/api/Dockerfile' = 'apps/gymops'
            'apps/reqhub/Dockerfile'          = '.'
          }
          $fail = 0
          foreach ($df in $changed) {
            if (-not (Test-Path $df)) { Write-Host "removido: $df - pulando"; continue }
            $ctx = if ($ctxMap.ContainsKey($df)) { $ctxMap[$df] } else { Split-Path $df -Parent }
            $tag = 'ci-smoke/' + (($df -replace '^apps/','' -replace '/Dockerfile[^/]*$','' -replace '[/.]','-').ToLower())
            Write-Host "== docker build $df (contexto $ctx) -> $tag =="
            docker build -t $tag -f $df $ctx
            if ($LASTEXITCODE -ne 0) { Write-Host "::error title=Dockerfile quebrado::docker build falhou para $df"; $fail++ }
          }
          exit $fail

  apps:
    name: ${{ matrix.app }}
    needs: detect
    if: needs.detect.outputs.include != '' && needs.detect.outputs.include != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.include) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: |
          set -e
          # SEM fallback silencioso: `npm ci || npm install` mascarava lockfile
          # fora de sync (EUSAGE) — o job ficava verde com a imagem quebrada.
          # Convencao identica a dos Dockerfiles da plataforma.
          if [ "${{ matrix.pm }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
          fi

      - name: Preparar (codegen, se houver)
        if: matrix.prep != ''
        run: ${{ matrix.prep }}

      - name: Verificacoes estaticas
        run: |
          PM="${{ matrix.pm }}"
          run_if () {
            if node -e "const s=require('./package.json').scripts||{};process.exit(s['$1']?0:1)"; then
              echo "::group::$PM run $1"
              $PM run "$1"
              echo "::endgroup::"
            else
              echo "skip: sem script '$1'"
            fi
          }
          for c in ${{ matrix.checks }}; do run_if "$c"; done
